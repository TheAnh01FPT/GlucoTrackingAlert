<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Kê đơn thuốc – GlucoTrackAlert</title>
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
        <style>
            :root {
                --primary: #1a56db;
                --primary-light: #ebf0ff;
                --primary-dark: #1e3a8a;
                --accent: #3b82f6;
                --sidebar-w: 240px;
                --font: 'Be Vietnam Pro', sans-serif;
            }
            * {
                font-family: var(--font);
            }
            body {
                background: #f0f4f8;
            }
            .sidebar {
                width:var(--sidebar-w);
                min-height:100vh;
                background:var(--primary-dark);
                position:fixed;
                top:0;
                left:0;
                display:flex;
                flex-direction:column;
                z-index:100;
            }
            .sidebar-logo {
                padding:24px 20px 16px;
                border-bottom:1px solid rgba(255,255,255,.1);
            }
            .sidebar-logo span {
                color:#fff;
                font-weight:700;
                font-size:1.1rem;
            }
            .sidebar-logo small {
                color:rgba(255,255,255,.5);
                font-size:.7rem;
                display:block;
            }
            .sidebar-nav {
                padding:12px 0;
                flex:1;
            }
            .nav-item-link {
                display:flex;
                align-items:center;
                gap:10px;
                padding:10px 20px;
                color:rgba(255,255,255,.7);
                text-decoration:none;
                font-size:.875rem;
                transition:all .2s;
            }
            .nav-item-link:hover, .nav-item-link.active {
                color:#fff;
                background:rgba(255,255,255,.1);
                border-left:3px solid var(--accent);
                padding-left:17px;
            }
            .nav-item-link i {
                font-size:1rem;
                width:20px;
            }
            .main {
                margin-left:var(--sidebar-w);
                padding:28px 32px;
            }
            .topbar {
                display:flex;
                align-items:center;
                justify-content:space-between;
                margin-bottom:24px;
            }
            .topbar h4 {
                font-weight:700;
                color:#1a1a2e;
                margin:0;
            }

            .panel {
                background:#fff;
                border-radius:14px;
                padding:24px 28px;
                box-shadow:0 1px 4px rgba(0,0,0,.06);
                border:1px solid #e8edf5;
                margin-bottom:24px;
            }
            .panel-title {
                font-weight:700;
                color:#1a1a2e;
                font-size:1rem;
                margin-bottom:18px;
                display:flex;
                align-items:center;
                gap:8px;
            }
            label.form-label {
                font-size:.82rem;
                font-weight:600;
                color:#495057;
            }
            .form-control, .form-select {
                border-radius:8px;
                font-size:.875rem;
                border:1px solid #dde3ee;
            }
            .form-control:focus, .form-select:focus {
                border-color:var(--accent);
                box-shadow:0 0 0 3px rgba(59,130,246,.15);
            }
            .item-card {
                border:1px solid #e8edf5;
                border-radius:10px;
                padding:18px 18px 8px;
                margin-bottom:14px;
                background:#fafbff;
                position:relative;
            }
            .item-card .remove-item-btn {
                position:absolute;
                top:10px;
                right:10px;
                border:none;
                background:none;
                color:#dc3545;
                font-size:1.1rem;
                cursor:pointer;
                line-height:1;
            }
            .item-card .remove-item-btn:hover {
                color:#a71d2a;
            }
            .btn-add-item {
                border:1.5px dashed #b9c6e6;
                background:#fff;
                color:var(--primary);
                border-radius:8px;
                padding:10px;
                width:100%;
                font-size:.85rem;
                font-weight:600;
            }
            .btn-add-item:hover {
                background:var(--primary-light);
            }
            .btn-primary-glow {
                background:linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
                border:none;
                font-weight:600;
                border-radius:8px;
                padding:10px 22px;
                font-size:.9rem;
            }
            .btn-primary-glow:disabled {
                opacity:.6;
            }

            .rx-card {
                border:1px solid #e8edf5;
                border-radius:10px;
                padding:16px 18px;
                margin-bottom:12px;
                background:#fff;
            }
            .rx-card .rx-head {
                display:flex;
                justify-content:space-between;
                align-items:flex-start;
                gap:8px;
            }
            .rx-status {
                font-size:.72rem;
                font-weight:700;
                padding:3px 10px;
                border-radius:20px;
                text-transform:uppercase;
                letter-spacing:.4px;
            }
            .rx-status.ACTIVE {
                background:#d4edda;
                color:#155724;
            }
            .rx-status.CANCELLED {
                background:#f8d7da;
                color:#721c24;
            }
            .rx-item-row {
                font-size:.83rem;
                color:#495057;
                padding:6px 0;
                border-top:1px dashed #eef1f6;
            }
            .rx-item-row:first-of-type {
                border-top:none;
            }
            .badge-soft {
                background:#eef2ff;
                color:#4338ca;
                border-radius:6px;
                padding:2px 8px;
                font-size:.72rem;
                font-weight:600;
            }
            .alert-floating {
                position:fixed;
                top:20px;
                right:20px;
                z-index:1000;
                min-width:300px;
                box-shadow:0 8px 24px rgba(0,0,0,.15);
            }
            .empty-hint {
                text-align:center;
                color:#9aa3b5;
                padding:32px 0;
                font-size:.85rem;
            }

            /* Card chỉ số bệnh nhân */
            .stats-card {
                background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%);
                border: 1px solid #bfdbfe;
                border-radius: 12px;
                padding: 16px 20px;
                margin-bottom: 16px;
                display: none;
            }
            .stats-card.visible {
                display: block;
            }
            .stats-card .stat-row {
                display:flex;
                gap:20px;
                flex-wrap:wrap;
                margin-top:10px;
            }
            .stat-box {
                background:#fff;
                border-radius:8px;
                padding:10px 16px;
                border:1px solid #e0e7ff;
                flex:1;
                min-width:110px;
                text-align:center;
            }
            .stat-box .val {
                font-size:1.25rem;
                font-weight:700;
                color:#1e3a8a;
            }
            .stat-box .lbl {
                font-size:.72rem;
                color:#6b7280;
                margin-top:2px;
            }
            .stat-box.danger .val {
                color:#dc2626;
            }
            .stat-box.warning .val {
                color:#d97706;
            }
            .stat-box.ok .val {
                color:#16a34a;
            }

            /* Nút AI */
            .btn-ai {
                background: linear-gradient(135deg, #7c3aed, #4f46e5);
                color:#fff;
                border:none;
                border-radius:8px;
                padding:9px 18px;
                font-size:.875rem;
                font-weight:600;
                cursor:pointer;
                display:flex;
                align-items:center;
                gap:8px;
                transition: opacity .2s;
            }
            .btn-ai:hover {
                opacity:.88;
            }
            .btn-ai:disabled {
                opacity:.5;
                cursor:not-allowed;
            }
            .ai-badge {
                background:#7c3aed;
                color:#fff;
                font-size:.65rem;
                font-weight:700;
                padding:2px 7px;
                border-radius:10px;
                letter-spacing:.4px;
            }

            /* Dropdown gợi ý thuốc (gõ để tìm) */
            .medicine-field {
                position: relative;
            }
            .medicine-suggestions {
                position: absolute;
                top: calc(100% + 6px);
                left: 0;
                right: 0;
                z-index: 50;
                background: #fff;
                border: 1px solid #e4e8f1;
                border-radius: 12px;
                max-height: 240px;
                overflow-y: auto;
                box-shadow: 0 12px 28px rgba(20,30,60,.12);
                padding: 6px;
            }
            .medicine-suggestions .suggestion-item {
                display: block;
                width: 100%;
                text-align: left;
                padding: 9px 12px;
                margin: 2px 0;
                border: none;
                border-radius: 8px;
                background: none;
                font-size: .85rem;
                line-height: 1.3;
                color: #1a1a2e;
                cursor: pointer;
                transition: background .12s ease;
            }
            .medicine-suggestions .suggestion-item:hover,
            .medicine-suggestions .suggestion-item.active {
                background: var(--primary-light);
                color: var(--primary);
            }
            .medicine-suggestions .suggestion-empty {
                padding: 10px 12px;
                font-size: .8rem;
                color: #9aa3b5;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div class="sidebar">
            <div class="sidebar-logo">
                <span><i class="bi bi-droplet-half me-2" style="color:#3b82f6"></i>GlucoTrackAlert</span>
                <small>Cổng bác sĩ</small>
            </div>
            <nav class="sidebar-nav">
                <a href="/doctor/home" class="nav-item-link"><i class="bi bi-speedometer2"></i> Tổng quan</a>
                <a href="/doctor/my-patients" class="nav-item-link"><i class="bi bi-people"></i> Bệnh nhân của tôi</a>
                <a href="/doctor/prescriptions" class="nav-item-link active"><i class="bi bi-capsule"></i> Kê đơn thuốc</a>
                <a href="/health-logs/doctor-view" class="nav-item-link"><i class="bi bi-graph-up"></i> Chỉ số Glucose</a>
                <a href="/articles/manage" class="nav-item-link"><i class="bi bi-newspaper"></i> Quản lý tin tức</a>
                <a href="/doctor/settings" class="nav-item-link"><i class="bi bi-gear"></i> Cài đặt</a>
            </nav>
            <div style="padding:16px 20px; border-top:1px solid rgba(255,255,255,.1)">
                <div style="color:rgba(255,255,255,.5); font-size:.75rem">Bác sĩ</div>
                <div style="color:#fff; font-size:.85rem; font-weight:600" id="sidebarDrName">–</div>
            </div>
        </div>

        <div class="main">
            <div class="topbar">
                <h4><i class="bi bi-capsule me-2" style="color:var(--primary)"></i>Kê đơn thuốc</h4>
            </div>

            <div class="row g-4">
                <!-- FORM KÊ ĐƠN -->
                <div class="col-lg-7">
                    <div class="panel">
                        <div class="panel-title"><i class="bi bi-clipboard2-plus"></i> Đơn thuốc mới</div>

                        <div class="mb-3">
                            <label class="form-label">Chọn bệnh nhân *</label>
                            <select class="form-select" id="patientSelect">
                                <option value="">— Đang tải danh sách bệnh nhân... —</option>
                            </select>
                        </div>

                        <!-- Card chỉ số sức khoẻ gần nhất + nút gợi ý AI -->
                        <div class="stats-card" id="statsCard">
                            <div style="display:flex; align-items:center; justify-content:space-between;">
                                <div style="font-size:.82rem; font-weight:700; color:#1e3a8a;">
                                    <i class="bi bi-activity me-1"></i> Chỉ số gần nhất
                                    <span style="font-weight:400; color:#6b7280; font-size:.75rem;" id="statsDate"></span>
                                </div>
                            </div>
                            <div class="stat-row">
                                <div class="stat-box" id="boxBloodSugar">
                                    <div class="val" id="valBloodSugar">–</div>
                                    <div class="lbl">Đường huyết (mmol/L)</div>
                                </div>
                                <div class="stat-box" id="boxBP">
                                    <div class="val" id="valBP">–</div>
                                    <div class="lbl">Huyết áp (mmHg)</div>
                                </div>
                                <div class="stat-box" id="boxBMI">
                                    <div class="val" id="valBMI">–</div>
                                    <div class="lbl">BMI</div>
                                </div>
                            </div>
                            <div id="statsSymptoms" style="margin-top:10px; font-size:.8rem; color:#6b7280; display:none;">
                                <i class="bi bi-chat-text me-1"></i> <span id="valSymptoms"></span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Ngày kê đơn</label>
                            <input type="date" class="form-control" id="prescribedDate"/>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Ghi chú đơn thuốc</label>
                            <textarea class="form-control" id="prescriptionNote" rows="2" placeholder="VD: Tái khám sau 1 tuần..."></textarea>
                        </div>

                        <hr/>

                        <div id="itemsContainer"></div>

                        <button type="button" class="btn-add-item mb-3" id="btnAddItem">
                            <i class="bi bi-plus-circle me-1"></i> Thêm thuốc
                        </button>

                        <div class="d-flex justify-content-end">
                            <button type="button" class="btn btn-primary-glow" id="btnSubmit">
                                <i class="bi bi-send-check me-1"></i> Tạo đơn thuốc
                            </button>
                        </div>
                    </div>
                </div>

                <!-- DANH SÁCH ĐƠN CỦA BỆNH NHÂN ĐANG CHỌN -->
                <div class="col-lg-5">
                    <div class="panel">
                        <div class="panel-title"><i class="bi bi-journal-medical"></i> Đơn thuốc của bệnh nhân</div>
                        <div id="rxList">
                            <div class="empty-hint">Chọn bệnh nhân để xem các đơn thuốc đã kê</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Item template (1 dòng thuốc) -->
        <template id="itemTemplate">
            <div class="item-card">
                <button type="button" class="remove-item-btn" title="Xoá thuốc này"><i class="bi bi-x-circle-fill"></i></button>
                <div class="row g-2">
                    <div class="col-md-6 medicine-field">
                        <label class="form-label">Tên thuốc *</label>
                        <input type="text" class="form-control item-medicineName"
                               placeholder="Gõ để tìm trong danh mục, hoặc nhập tên khác" autocomplete="off"/>
                        <div class="medicine-suggestions d-none"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Liều lượng *</label>
                        <input type="text" class="form-control item-dosage" placeholder="VD: 1 viên / lần"/>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Tần suất</label>
                        <input type="text" class="form-control item-frequency" placeholder="VD: 3 lần/ngày"/>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label">Giờ uống (HH:mm, phân cách bằng dấu phẩy) *</label>
                        <input type="text" class="form-control item-timeOfDay" placeholder="07:00,12:00,19:00"/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Số ngày uống *</label>
                        <input type="number" min="1" class="form-control item-durationDays" placeholder="7"/>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Hướng dẫn sử dụng</label>
                        <input type="text" class="form-control item-instructions" placeholder="VD: Uống sau ăn"/>
                    </div>
                    <div class="col-md-12 item-contraindications d-none" style="background:#fff5f5;border-left:3px solid #e53e3e;padding:6px 10px;margin-top:6px;font-size:.8rem;color:#c53030;border-radius:0 4px 4px 0;"></div>
                </div>
            </div>
        </template>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            function handleAuthError(status) {
                if (status === 401 || status === 403) {
                    localStorage.clear();
                    document.cookie = 'jwt=; path=/; max-age=0';
                    window.location.href = '/login';
                    return true;
                }
                return false;
            }

            function authHeaders(extra) {
                const h = Object.assign({'Authorization': `Bearer ${localStorage.getItem('token')}`}, extra || {});
                return h;
            }

            function showToast(message, type) {
                const div = document.createElement('div');
                div.className = `alert alert-${type || 'success'} alert-floating alert-dismissible fade show`;
                div.innerHTML = `${message}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
                document.body.appendChild(div);
                setTimeout(() => div.remove(), 5000);
            }

            let currentDoctorId = null;

            function getDoctorIdFromUrl() {
                return new URLSearchParams(window.location.search).get('doctorId')
                        || localStorage.getItem('doctorId');
            }

            // Nếu URL không có ?doctorId=, tin localStorage là rủi ro (có thể bị dính
            // giá trị cũ/sai từ 1 session trước đó trên cùng trình duyệt). Trong trường
            // hợp đó, xác thực lại với server qua JWT rồi đồng bộ lại localStorage.
            async function resolveDoctorId() {
                const fromUrl = new URLSearchParams(window.location.search).get('doctorId');
                if (fromUrl) return fromUrl;
                try {
                    const me = await fetch('/api/doctors/me', {headers: authHeaders()});
                    if (me.ok) {
                        const doc = await me.json();
                        if (doc && doc.id) {
                            localStorage.setItem('doctorId', doc.id);
                            return doc.id;
                        }
                    }
                    handleAuthError(me.status);
                } catch {
                    // Server không phản hồi được -> tạm dùng localStorage cũ làm fallback
                }
                return localStorage.getItem('doctorId');
            }

            async function loadDoctorName() {
                try {
                    const doc = await fetch(`/api/doctors/${currentDoctorId}`, {headers: authHeaders()})
                            .then(r => {
                                if (handleAuthError(r.status))
                                    return null;
                                return r.json();
                            });
                    if (doc)
                        document.getElementById('sidebarDrName').textContent = doc.fullName || '–';
                } catch (e) { /* không chặn luồng chính nếu lỗi */
                }
            }

            async function loadPatientOptions() {
                const select = document.getElementById('patientSelect');
                try {
                    const patients = await fetch(`/api/doctor/${currentDoctorId}/patients`, {headers: authHeaders()})
                            .then(r => {
                                if (handleAuthError(r.status))
                                    return [];
                                return r.json();
                            });
                    if (!patients || !patients.length) {
                        select.innerHTML = '<option value="">— Bạn chưa có bệnh nhân nào được phân công —</option>';
                        return;
                    }
                    select.innerHTML = '<option value="">— Chọn bệnh nhân —</option>' +
                            patients.map(p => `<option value="${p.id}">${p.fullName || ('Bệnh nhân #' + p.id)}${p.phone ? ' · ' + p.phone : ''}</option>`).join('');

                    const presetId = new URLSearchParams(window.location.search).get('patientId');
                    if (presetId) {
                        select.value = presetId;
                        loadPrescriptionsForPatient(presetId);
                        loadPatientStats(presetId);
                    }
                } catch (e) {
                    select.innerHTML = '<option value="">— Lỗi tải danh sách bệnh nhân —</option>';
                }
            }

            // ==================== DANH MỤC THUỐC (dropdown gõ-để-tìm tự viết) ====================
            let medicineCatalog = [];

            async function loadMedicineCatalog() {
                try {
                    medicineCatalog = await fetch('/api/medications/catalog', {headers: authHeaders()})
                            .then(r => {
                                if (handleAuthError(r.status))
                                    return [];
                                return r.json();
                            });
                } catch (e) {
                    medicineCatalog = [];
                }
            }

            function checkContraindication(nameInput, contraBox) {
                // So khớp đúng tên với danh mục để hiện cảnh báo chống chỉ định;
                // gõ tên không khớp (thuốc ngoài danh mục) vẫn được chấp nhận bình thường.
                const med = medicineCatalog.find(m => m.name === nameInput.value);
                if (med && med.contraindications) {
                    contraBox.textContent = `🚫 Chống chỉ định: ${med.contraindications}`;
                    contraBox.classList.remove('d-none');
                } else {
                    contraBox.textContent = '';
                    contraBox.classList.add('d-none');
                }
            }

            function renderSuggestions(box, matches, nameInput, contraBox) {
                if (!matches.length) {
                    box.innerHTML = '<div class="suggestion-empty">Không có thuốc khớp trong danh mục — cứ gõ tiếp tên bạn muốn</div>';
                } else {
                    box.innerHTML = matches.map(m =>
                            `<button type="button" class="suggestion-item" data-name="${escapeHtml(m.name)}">${escapeHtml(m.name)}</button>`
                    ).join('');
                }
                box.classList.remove('d-none');

                box.querySelectorAll('.suggestion-item').forEach(btn => {
                    // dùng mousedown thay vì click để chạy TRƯỚC sự kiện blur của input
                    btn.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        nameInput.value = btn.dataset.name;
                        box.classList.add('d-none');
                        checkContraindication(nameInput, contraBox);
                    });
                });
            }

            function wireMedicineSelect(card) {
                const nameInput = card.querySelector('.item-medicineName');
                const box = card.querySelector('.medicine-suggestions');
                const contraBox = card.querySelector('.item-contraindications');

                const showFiltered = () => {
                    const q = nameInput.value.trim().toLowerCase();
                    const matches = (q ? medicineCatalog.filter(m => m.name.toLowerCase().includes(q)) : medicineCatalog)
                            .slice(0, 8);
                    renderSuggestions(box, matches, nameInput, contraBox);
                };

                nameInput.addEventListener('focus', showFiltered);
                nameInput.addEventListener('input', () => {
                    showFiltered();
                    checkContraindication(nameInput, contraBox);
                });
                nameInput.addEventListener('blur', () => {
                    // delay nhỏ để mousedown trên gợi ý kịp xử lý trước khi list bị ẩn
                    setTimeout(() => box.classList.add('d-none'), 150);
                });
            }

            function addItemRow() {
                const tpl = document.getElementById('itemTemplate');
                const clone = tpl.content.cloneNode(true);
                const card = clone.querySelector('.item-card');
                card.querySelector('.remove-item-btn').addEventListener('click', () => {
                    const container = document.getElementById('itemsContainer');
                    if (container.querySelectorAll('.item-card').length > 1) {
                        card.remove();
                    } else {
                        showToast('Đơn thuốc phải có ít nhất một loại thuốc', 'warning');
                    }
                });
                wireMedicineSelect(card);
                document.getElementById('itemsContainer').appendChild(clone);
            }

            function collectItems() {
                const cards = document.querySelectorAll('#itemsContainer .item-card');
                const items = [];
                for (const card of cards) {
                    const medicineName = card.querySelector('.item-medicineName').value.trim();
                    const dosage = card.querySelector('.item-dosage').value.trim();
                    const frequency = card.querySelector('.item-frequency').value.trim();
                    const timeOfDay = card.querySelector('.item-timeOfDay').value.trim();
                    const durationDays = card.querySelector('.item-durationDays').value.trim();
                    const instructions = card.querySelector('.item-instructions').value.trim();

                    if (!medicineName && !dosage && !timeOfDay && !durationDays) {
                        continue; // dòng trống, bỏ qua
                    }
                    items.push({
                        medicineName: medicineName,
                        dosage: dosage,
                        frequency: frequency || null,
                        timeOfDay: timeOfDay,
                        durationDays: durationDays ? parseInt(durationDays, 10) : null,
                        instructions: instructions || null
                    });
                }
                return items;
            }

            function validateBeforeSubmit(patientId, items) {
                if (!patientId)
                    return 'Vui lòng chọn bệnh nhân';
                if (!items.length)
                    return 'Vui lòng nhập ít nhất một loại thuốc';
                for (const it of items) {
                    if (!it.medicineName)
                        return 'Tên thuốc không được để trống';
                    if (!it.dosage)
                        return 'Liều lượng không được để trống';
                    if (!it.timeOfDay)
                        return 'Giờ uống thuốc không được để trống';
                    if (!/^([01]\d|2[0-3]):[0-5]\d(\s*,\s*([01]\d|2[0-3]):[0-5]\d)*$/.test(it.timeOfDay)) {
                        return `Giờ uống thuốc "${it.timeOfDay}" sai định dạng (vd: 07:00,12:00,19:00)`;
                    }
                    if (!it.durationDays || it.durationDays < 1)
                        return 'Số ngày uống thuốc phải lớn hơn hoặc bằng 1';
                }
                return null;
            }

            async function submitPrescription() {
                const patientId = document.getElementById('patientSelect').value;
                const items = collectItems();
                const error = validateBeforeSubmit(patientId, items);
                if (error) {
                    showToast(error, 'danger');
                    return;
                }

                const payload = {
                    patientId: parseInt(patientId, 10),
                    prescribedDate: document.getElementById('prescribedDate').value || null,
                    note: document.getElementById('prescriptionNote').value.trim() || null,
                    items: items
                };

                const btn = document.getElementById('btnSubmit');
                btn.disabled = true;
                btn.innerHTML = '<i class="bi bi-hourglass-split me-1"></i> Đang tạo đơn...';

                try {
                    const res = await fetch('/api/medications/prescriptions', {
                        method: 'POST',
                        headers: authHeaders({'Content-Type': 'application/json'}),
                        body: JSON.stringify(payload)
                    });
                    if (handleAuthError(res.status))
                        return;

                    const data = await res.json();
                    if (!res.ok) {
                        showToast(data.error || data.message || 'Không thể tạo đơn thuốc', 'danger');
                        return;
                    }
                    showToast(`Đã tạo đơn thuốc #${data.id} thành công. Lời nhắc uống thuốc đã được lên lịch.`, 'success');
                    resetForm();
                    loadPrescriptionsForPatient(patientId);
                } catch (e) {
                    showToast('Lỗi kết nối khi tạo đơn thuốc', 'danger');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-send-check me-1"></i> Tạo đơn thuốc';
                }
            }

            function resetForm() {
                document.getElementById('prescriptionNote').value = '';
                document.getElementById('itemsContainer').innerHTML = '';
                addItemRow();
            }

            async function loadPrescriptionsForPatient(patientId) {
                const list = document.getElementById('rxList');
                if (!patientId) {
                    list.innerHTML = '<div class="empty-hint">Chọn bệnh nhân để xem các đơn thuốc đã kê</div>';
                    return;
                }
                list.innerHTML = '<div class="empty-hint"><i class="bi bi-arrow-clockwise"></i> Đang tải...</div>';
                try {
                    const res = await fetch(`/api/medications/prescriptions/patient/${patientId}`, {headers: authHeaders()});
                    if (handleAuthError(res.status))
                        return;
                    const prescriptions = await res.json();
                    renderPrescriptions(prescriptions);
                } catch (e) {
                    list.innerHTML = '<div class="empty-hint text-danger">Không tải được đơn thuốc</div>';
                }
            }

            function renderPrescriptions(prescriptions) {
                const list = document.getElementById('rxList');
                if (!prescriptions || !prescriptions.length) {
                    list.innerHTML = '<div class="empty-hint">Bệnh nhân này chưa có đơn thuốc nào</div>';
                    return;
                }
                list.innerHTML = prescriptions.map(rx => `
                    <div class="rx-card" data-rx-id="${rx.id}">
                        <div class="rx-head">
                            <div>
                                <div style="font-weight:700; font-size:.9rem;">Đơn #${rx.id} <span class="badge-soft">${rx.prescribedDate || ''}</span></div>
                                ${rx.note ? `<div style="font-size:.78rem; color:#6c757d; margin-top:2px;">${escapeHtml(rx.note)}</div>` : ''}
                            </div>
                            <span class="rx-status ${rx.status}">${rx.status === 'CANCELLED' ? 'Đã huỷ' : 'Đang dùng'}</span>
                        </div>
                        ${(rx.items || []).map(it => `
                            <div class="rx-item-row">
                                <strong>${escapeHtml(it.medicineName || '')}</strong> — ${escapeHtml(it.dosage || '')}
                                <br/><span style="color:#868e96;">${escapeHtml(it.timeOfDay || '')} · ${it.durationDays || '?'} ngày${it.instructions ? ' · ' + escapeHtml(it.instructions) : ''}</span>
                            </div>
                        `).join('')}
                        ${rx.status === 'ACTIVE' ? `
                            <div class="text-end mt-2">
                                <button class="btn btn-sm btn-outline-danger" onclick="cancelPrescription(${rx.id})">
                                    <i class="bi bi-x-circle"></i> Huỷ đơn
                                </button>
                            </div>` : ''}
                    </div>
                `).join('');
            }

            function escapeHtml(text) {
                if (!text)
                    return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            async function cancelPrescription(rxId) {
                if (!confirm(`Xác nhận huỷ đơn thuốc #${rxId}? Các lời nhắc uống thuốc liên quan cũng sẽ bị huỷ.`))
                    return;
                try {
                    const res = await fetch(`/api/medications/prescriptions/${rxId}/cancel`, {
                        method: 'PATCH',
                        headers: authHeaders()
                    });
                    if (handleAuthError(res.status))
                        return;
                    if (!res.ok) {
                        showToast('Không thể huỷ đơn thuốc', 'danger');
                        return;
                    }
                    showToast(`Đã huỷ đơn thuốc #${rxId}`, 'success');
                    const patientId = document.getElementById('patientSelect').value;
                    loadPrescriptionsForPatient(patientId);
                } catch (e) {
                    showToast('Lỗi kết nối khi huỷ đơn thuốc', 'danger');
                }
            }

            document.getElementById('btnAddItem').addEventListener('click', addItemRow);
            document.getElementById('btnSubmit').addEventListener('click', submitPrescription);
            document.getElementById('patientSelect').addEventListener('change', (e) => {
                loadPrescriptionsForPatient(e.target.value);
                loadPatientStats(e.target.value);
            });

            // ==================== CHỈ SỐ BỆNH NHÂN ====================
            let currentStats = null;

            async function loadPatientStats(patientId) {
                const card = document.getElementById('statsCard');
                if (!patientId) {
                    card.classList.remove('visible');
                    currentStats = null;
                    return;
                }
                try {
                    const res = await fetch(`/api/health-logs/patient/${patientId}/latest`, {headers: authHeaders()});
                    const data = await res.json();
                    if (!data.found) {
                        card.classList.remove('visible');
                        currentStats = null;
                        return;
                    }
                    currentStats = data;
                    card.classList.add('visible');

                    // Ngày đo
                    document.getElementById('statsDate').textContent = data.logDate ? ' · ' + data.logDate : '';

                    // Đường huyết
                    const bs = data.bloodSugar;
                    const bsEl = document.getElementById('valBloodSugar');
                    const bsBox = document.getElementById('boxBloodSugar');
                    bsEl.textContent = bs != null ? parseFloat(bs).toFixed(1) : '–';
                    bsBox.className = 'stat-box ' + (bs == null ? '' : bs >= 11 ? 'danger' : bs >= 7 ? 'warning' : 'ok');

                    // Huyết áp
                    const bp = (data.systolic && data.diastolic) ? `${data.systolic}/${data.diastolic}` : '–';
                    document.getElementById('valBP').textContent = bp;
                    const bpBox = document.getElementById('boxBP');
                    bpBox.className = 'stat-box ' + (data.systolic >= 140 ? 'danger' : data.systolic >= 130 ? 'warning' : 'ok');

                    // BMI
                    document.getElementById('valBMI').textContent = data.patientBmi != null ? parseFloat(data.patientBmi).toFixed(1) : '–';

                    // Triệu chứng
                    if (data.symptoms) {
                        document.getElementById('valSymptoms').textContent = data.symptoms;
                        document.getElementById('statsSymptoms').style.display = 'block';
                    } else {
                        document.getElementById('statsSymptoms').style.display = 'none';
                    }
                } catch (e) {
                    card.classList.remove('visible');
                    currentStats = null;
                }
            }

            // ==================== KẾT THÚC PHẦN CHỈ SỐ / DANH MỤC THUỐC ====================

            document.addEventListener('DOMContentLoaded', async function () {
                currentDoctorId = await resolveDoctorId();
                document.getElementById('prescribedDate').value = new Date().toISOString().slice(0, 10);
                await loadMedicineCatalog();
                addItemRow();

                if (!currentDoctorId) {
                    showToast('Không xác định được bác sĩ đang đăng nhập, vui lòng đăng nhập lại', 'danger');
                    return;
                }
                loadDoctorName();
                loadPatientOptions();
            });
        </script>
    </body>

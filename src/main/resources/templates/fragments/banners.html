<div th:fragment="banner-slider" xmlns:th="http://www.thymeleaf.org">
    <!-- Hiển thị mặc định nếu chưa có dữ liệu banner trong DB -->
    <div th:if="${banners == null || banners.empty}" class="hero-section">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-6">
                    <h1 class="display-5 fw-bold text-success mb-3">Theo Dõi Sức Khỏe, Chủ Động Phòng Ngừa Tiểu Đường</h1>
                    <p class="lead mb-4">Hệ thống theo dõi chỉ số đường huyết hàng ngày, đưa ra cảnh báo tức thời cho người thân và hỗ trợ phân tích biến chứng chuyên nghiệp từ bác sĩ.</p>
                    <div class="d-flex gap-3">
                        <a href="/register" class="btn btn-primary-custom btn-lg">Trải nghiệm ngay</a>
                        <a href="#features" class="btn btn-outline-dark btn-lg">Tìm hiểu thêm</a>
                    </div>
                </div>
                <div class="col-lg-6 d-none d-lg-block text-center">
                    <i class="bi bi-shield-plus text-success" style="font-size: 15rem; opacity: 0.85;"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Hiển thị danh sách banner động lấy từ cơ sở dữ liệu -->
    <div th:if="${banners != null && !banners.empty}" id="heroBannerCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div th:each="banner, iterStat : ${banners}" 
                 th:class="${iterStat.index == 0} ? 'carousel-item active' : 'carousel-item'">
                <div class="hero-section" style="background-color: var(--primary-light);">
                    <div class="container">
                        <div class="row align-items-center">
                            <div class="col-lg-6">
                                <h1 class="display-5 fw-bold text-success mb-3" th:text="${banner.title}">Tiêu đề</h1>
                                <p class="lead mb-4" th:text="${banner.subtitle}">Phụ đề</p>
                                <div class="d-flex gap-3" th:if="${banner.redirectUrl != null && !banner.redirectUrl.isEmpty()}">
                                    <a th:href="${banner.redirectUrl}" class="btn btn-primary-custom btn-lg">Tìm hiểu thêm</a>
                                </div>
                            </div>
                            <div class="col-lg-6 d-none d-lg-block text-center">
                                <img th:src="${banner.imageUrl}" alt="Banner Image" class="img-fluid rounded shadow" style="max-height: 350px; object-fit: cover;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Controls -->
        <button th:if="${banners.size() > 1}" class="carousel-control-prev" type="button" data-bs-target="#heroBannerCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true" style="background-color: rgba(26,107,90,0.5); border-radius: 50%; padding: 1.5rem;"></span>
            <span class="visually-hidden">Trước</span>
        </button>
        <button th:if="${banners.size() > 1}" class="carousel-control-next" type="button" data-bs-target="#heroBannerCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true" style="background-color: rgba(26,107,90,0.5); border-radius: 50%; padding: 1.5rem;"></span>
            <span class="visually-hidden">Sau</span>
        </button>
    </div>
</div>

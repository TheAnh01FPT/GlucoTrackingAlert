<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Quản Lý Đánh Giá</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        h2 {
            color: #1a6b5a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f8fafc;
            color: #334155;
            font-weight: 600;
            font-size: 14px;
        }

        td {
            font-size: 14px;
            color: #475569;
            vertical-align: top;
        }

        .reply-form {
            margin-top: 10px;
        }

        textarea {
            width: 100%;
            height: 60px;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin-bottom: 10px;
            font-family: inherit;
            resize: vertical;
        }

        button {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
        }

        button:hover {
            background: #2563eb;
        }

        .replied {
            color: #16a34a;
            font-weight: 600;
        }

        .pending {
            color: #d97706;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Quản Lý Đánh Giá Từ Bệnh Nhân</h2>

        <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>

        <div style="margin-bottom: 20px;">
            <a href="/admin/dashboard" style="color: #27ae60; text-decoration: none;">&larr; Quay lại Admin
                Dashboard</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th width="15%">Bệnh nhân</th>
                    <th width="15%">Thời gian</th>
                    <th width="35%">Nội dung đánh giá</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="fb : ${feedbacks}">
                    <td>
                        <strong th:text="${fb.patient.user.fullName}"></strong><br>
                        <span style="font-size: 12px; color: #64748b;" th:text="${fb.patient.user.email}"></span>
                    </td>
                    <td th:text="${#temporals.format(fb.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${fb.content}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(feedbacks)}">
                    <td colspan="3" style="text-align: center; color: #64748b;">Chưa có đánh giá nào từ bệnh nhân.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>

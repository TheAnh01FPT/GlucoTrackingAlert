<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đánh Giá</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #f8fafc;
            padding: 30px;
            color: #334155;
            margin: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h2 {
            color: #0f172a;
            margin: 0;
            font-weight: 700;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-success {
            background: #f0fdf4;
            color: #15803d;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 4px solid #22c55e;
            font-weight: 500;
        }

        .back-link {
            color: #64748b;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f1f5f9;
            padding: 10px 16px;
            border-radius: 8px;
        }

        .back-link:hover {
            color: #0f172a;
            background: #e2e8f0;
        }

        /* Modern Table Design */
        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }

        th, td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid #f1f5f9;
        }

        tr:last-child td {
            border-bottom: none;
        }

        th {
            background: #f8fafc;
            color: #475569;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        .patient-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .patient-name {
            font-weight: 600;
            color: #0f172a;
            font-size: 15px;
        }

        .patient-email {
            font-size: 13px;
            color: #64748b;
        }

        .doctor-info {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #0f172a;
            font-weight: 500;
        }

        .rating-stars {
            color: #fbbf24;
            font-size: 16px;
            letter-spacing: 2px;
        }

        .feedback-date {
            font-size: 14px;
            color: #64748b;
            white-space: nowrap;
        }

        .feedback-content {
            font-size: 15px;
            color: #334155;
            line-height: 1.6;
            min-width: 300px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px !important;
            color: #64748b;
        }

        /* Stats Section */
        .stats-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            flex: 1;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        
        .stat-card h3 {
            margin: 0 0 10px 0;
            color: #64748b;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
            color: #0f172a;
        }
        
        .stat-card .sub-text {
            font-size: 14px;
            color: #fbbf24;
            margin-top: 5px;
        }
        
        .rating-bars {
            flex: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .rating-bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #475569;
        }
        
        .rating-bar-label {
            width: 40px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .rating-bar-container {
            flex: 1;
            background: #f1f5f9;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .rating-bar-fill {
            height: 100%;
            background: #fbbf24;
            border-radius: 4px;
        }
        
        .rating-bar-count {
            width: 30px;
            text-align: right;
            font-weight: 600;
        }
        
        /* Filter Section */
        .filter-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border-radius: 20px;
            background: #f1f5f9;
            color: #475569;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .filter-btn:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        .filter-btn.active {
            background: #3b82f6;
            color: white;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.3);
        }

        /* Pagination & Page Size */
        .pagination-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #f1f5f9;
        }

        .page-size-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #475569;
            font-size: 14px;
        }

        .page-size-selector select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background-color: #fff;
            color: #334155;
            font-family: inherit;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .page-size-selector select:focus {
            border-color: #3b82f6;
        }

        .pagination {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .page-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            height: 36px;
            padding: 0 10px;
            border-radius: 8px;
            background: #fff;
            border: 1px solid #e2e8f0;
            color: #475569;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s;
        }

        .page-btn:hover:not(.disabled) {
            background: #f1f5f9;
            color: #0f172a;
            border-color: #cbd5e1;
        }

        .page-btn.active {
            background: #3b82f6;
            color: #fff;
            border-color: #3b82f6;
        }

        .page-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #f8fafc;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}"/>
</head>

<body class="admin-layout-body">
<div th:replace="~{fragments/layout :: sidebar('feedbacks')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/layout :: topbar('Quản Lý Đánh Giá Từ Bệnh Nhân')}"></div>

    <div class="container">

    <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>

    <!-- Rating Summary Header -->
    <div class="stats-container">
        <div class="stat-card">
            <h3>Tổng đánh giá</h3>
            <div class="value" th:text="${totalReviews}">0</div>
            <div class="sub-text">Người dùng đã phản hồi</div>
        </div>
        <div class="stat-card">
            <h3>Trung bình sao</h3>
            <div class="value" th:text="${averageRating}">0.0</div>
            <div class="sub-text">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star-half-stroke"></i>
            </div>
        </div>
        <div class="stat-card rating-bars">
            <div class="rating-bar-row">
                <span class="rating-bar-label">5 <i class="fa-solid fa-star text-yellow-400" style="color: #fbbf24"></i></span>
                <div class="rating-bar-container">
                    <div class="rating-bar-fill" th:style="'width: ' + (${totalReviews > 0 ? (star5 * 100.0 / totalReviews) : 0}) + '%'"></div>
                </div>
                <span class="rating-bar-count" th:text="${star5}">0</span>
            </div>
            <div class="rating-bar-row">
                <span class="rating-bar-label">4 <i class="fa-solid fa-star text-yellow-400" style="color: #fbbf24"></i></span>
                <div class="rating-bar-container">
                    <div class="rating-bar-fill" th:style="'width: ' + (${totalReviews > 0 ? (star4 * 100.0 / totalReviews) : 0}) + '%'"></div>
                </div>
                <span class="rating-bar-count" th:text="${star4}">0</span>
            </div>
            <div class="rating-bar-row">
                <span class="rating-bar-label">3 <i class="fa-solid fa-star text-yellow-400" style="color: #fbbf24"></i></span>
                <div class="rating-bar-container">
                    <div class="rating-bar-fill" th:style="'width: ' + (${totalReviews > 0 ? (star3 * 100.0 / totalReviews) : 0}) + '%'"></div>
                </div>
                <span class="rating-bar-count" th:text="${star3}">0</span>
            </div>
            <div class="rating-bar-row">
                <span class="rating-bar-label">2 <i class="fa-solid fa-star text-yellow-400" style="color: #fbbf24"></i></span>
                <div class="rating-bar-container">
                    <div class="rating-bar-fill" th:style="'width: ' + (${totalReviews > 0 ? (star2 * 100.0 / totalReviews) : 0}) + '%'"></div>
                </div>
                <span class="rating-bar-count" th:text="${star2}">0</span>
            </div>
            <div class="rating-bar-row">
                <span class="rating-bar-label">1 <i class="fa-solid fa-star text-yellow-400" style="color: #fbbf24"></i></span>
                <div class="rating-bar-container">
                    <div class="rating-bar-fill" th:style="'width: ' + (${totalReviews > 0 ? (star1 * 100.0 / totalReviews) : 0}) + '%'"></div>
                </div>
                <span class="rating-bar-count" th:text="${star1}">0</span>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="filter-container">
        <a th:href="@{/admin/feedbacks(size=${pageSize})}" th:classappend="${currentFilter == null} ? 'active' : ''" class="filter-btn">
            Tất cả
        </a>
        <a th:href="@{/admin/feedbacks(rating=5, size=${pageSize})}" th:classappend="${currentFilter == 5} ? 'active' : ''" class="filter-btn">
            5 Sao <i class="fa-solid fa-star text-yellow-400"></i>
        </a>
        <a th:href="@{/admin/feedbacks(rating=4, size=${pageSize})}" th:classappend="${currentFilter == 4} ? 'active' : ''" class="filter-btn">
            4 Sao <i class="fa-solid fa-star text-yellow-400"></i>
        </a>
        <a th:href="@{/admin/feedbacks(rating=3, size=${pageSize})}" th:classappend="${currentFilter == 3} ? 'active' : ''" class="filter-btn">
            3 Sao <i class="fa-solid fa-star text-yellow-400"></i>
        </a>
        <a th:href="@{/admin/feedbacks(rating=2, size=${pageSize})}" th:classappend="${currentFilter == 2} ? 'active' : ''" class="filter-btn">
            2 Sao <i class="fa-solid fa-star text-yellow-400"></i>
        </a>
        <a th:href="@{/admin/feedbacks(rating=1, size=${pageSize})}" th:classappend="${currentFilter == 1} ? 'active' : ''" class="filter-btn">
            1 Sao <i class="fa-solid fa-star text-yellow-400"></i>
        </a>
    </div>

    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th width="25%">Bệnh nhân</th>
                <th width="15%">Đánh giá</th>
                <th width="20%">Thời gian</th>
                <th width="40%">Nội dung</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="fb : ${feedbacks}">
                <td>
                    <div class="patient-info">
                        <span class="patient-name" th:text="${#strings.isEmpty(fb.patient.fullName) ? fb.patient.user.email : fb.patient.fullName}"></span>
                        <span class="patient-email" th:if="${not #strings.isEmpty(fb.patient.fullName)}">
                            <i class="fa-regular fa-envelope"></i> <span th:text="${fb.patient.user.email}"></span>
                        </span>
                    </div>
                </td>
                <td>
                    <div class="rating-stars" th:if="${fb.rating != null}">
                        <th:block th:each="i : ${#numbers.sequence(1, fb.rating)}"><i class="fa-solid fa-star"></i>
                        </th:block>
                    </div>
                    <span th:if="${fb.rating == null}" style="color: #94a3b8; font-style: italic; font-size: 14px;">Chưa đánh giá</span>
                </td>
                <td class="feedback-date">
                    <span th:text="${#temporals.format(fb.createdAt, 'dd/MM/yyyy')}"></span><br>
                    <span style="font-size: 12px; color: #94a3b8;"
                          th:text="${#temporals.format(fb.createdAt, 'HH:mm')}"></span>
                </td>
                <td>
                    <div class="feedback-content" th:text="${fb.content}"></div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(feedbacks)}">
                <td colspan="4" class="empty-state">
                    <i class="fa-regular fa-folder-open text-4xl mb-3" style="display: block; color: #cbd5e1;"></i>
                    Chưa có đánh giá nào từ bệnh nhân.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination & Page Size -->
    <div class="pagination-controls" th:if="${totalPages > 0}">
        <!-- Page Size Selector -->
        <div class="page-size-selector">
            <span>Hiển thị</span>
            <select onchange="window.location.href=this.value">
                <option th:value="@{/admin/feedbacks(size=5, page=1, rating=${currentFilter})}" th:selected="${pageSize == 5}">5</option>
                <option th:value="@{/admin/feedbacks(size=10, page=1, rating=${currentFilter})}" th:selected="${pageSize == 10}">10</option>
                <option th:value="@{/admin/feedbacks(size=20, page=1, rating=${currentFilter})}" th:selected="${pageSize == 20}">20</option>
                <option th:value="@{/admin/feedbacks(size=50, page=1, rating=${currentFilter})}" th:selected="${pageSize == 50}">50</option>
            </select>
            <span>đánh giá / trang (Tổng cộng: <span th:text="${totalItems}">0</span>)</span>
        </div>

        <!-- Pagination Buttons -->
        <div class="pagination">
            <!-- Prev Button -->
            <a th:href="@{/admin/feedbacks(page=${currentPage - 1}, size=${pageSize}, rating=${currentFilter})}"
               th:classappend="${currentPage == 1} ? 'disabled' : ''"
               class="page-btn" title="Trang trước"
               th:style="${currentPage == 1} ? 'pointer-events: none;' : ''">
                <i class="fa-solid fa-chevron-left"></i>
            </a>

            <!-- Page Numbers -->
            <th:block th:each="pageNum : ${#numbers.sequence(1, totalPages)}">
                <!-- Hiển thị trang đầu, trang cuối, trang hiện tại và các trang lân cận -->
                <a th:if="${pageNum == 1 or pageNum == totalPages or (pageNum >= currentPage - 2 and pageNum <= currentPage + 2)}"
                   th:href="@{/admin/feedbacks(page=${pageNum}, size=${pageSize}, rating=${currentFilter})}"
                   th:classappend="${pageNum == currentPage} ? 'active' : ''"
                   class="page-btn" th:text="${pageNum}">1</a>
                
                <span th:if="${(pageNum == 2 and currentPage > 4) or (pageNum == totalPages - 1 and currentPage < totalPages - 3)}"
                      style="padding: 0 5px; color: #94a3b8;">...</span>
            </th:block>

            <!-- Next Button -->
            <a th:href="@{/admin/feedbacks(page=${currentPage + 1}, size=${pageSize}, rating=${currentFilter})}"
               th:classappend="${currentPage == totalPages} ? 'disabled' : ''"
               class="page-btn" title="Trang sau"
               th:style="${currentPage == totalPages} ? 'pointer-events: none;' : ''">
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>
    </div>

</div>
</div>
</body>

</html>

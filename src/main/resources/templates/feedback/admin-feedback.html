<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Quản Lý Đánh Giá</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #f8fafc;
            padding: 30px;
            color: #334155;
            margin: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h2 {
            color: #0f172a;
            margin: 0;
            font-weight: 700;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-success {
            background: #f0fdf4;
            color: #15803d;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 4px solid #22c55e;
            font-weight: 500;
        }

        .back-link {
            color: #64748b;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f1f5f9;
            padding: 10px 16px;
            border-radius: 8px;
        }

        .back-link:hover {
            color: #0f172a;
            background: #e2e8f0;
        }

        /* Modern Table Design */
        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }

        th, td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid #f1f5f9;
        }

        tr:last-child td {
            border-bottom: none;
        }

        th {
            background: #f8fafc;
            color: #475569;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        .patient-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .patient-name {
            font-weight: 600;
            color: #0f172a;
            font-size: 15px;
        }

        .patient-email {
            font-size: 13px;
            color: #64748b;
        }

        .doctor-info {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #0f172a;
            font-weight: 500;
        }

        .rating-stars {
            color: #fbbf24;
            font-size: 16px;
            letter-spacing: 2px;
        }

        .feedback-date {
            font-size: 14px;
            color: #64748b;
            white-space: nowrap;
        }

        .feedback-content {
            font-size: 15px;
            color: #334155;
            line-height: 1.6;
            min-width: 300px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px !important;
            color: #64748b;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="header-section">
        <h2><i class="fa-solid fa-star-half-stroke text-blue-500"></i> Quản Lý Đánh Giá Từ Bệnh Nhân</h2>
        <a href="/admin/dashboard" class="back-link"><i class="fa-solid fa-arrow-left"></i> Quay lại Dashboard</a>
    </div>

    <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>

    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th width="20%">Bệnh nhân</th>
                <th width="15%">Bác sĩ</th>
                <th width="15%">Đánh giá</th>
                <th width="15%">Thời gian</th>
                <th width="35%">Nội dung</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="fb : ${feedbacks}">
                <td>
                    <div class="patient-info">
                        <span class="patient-name" th:text="${fb.patient.user.fullName}"></span>
                        <span class="patient-email"><i class="fa-regular fa-envelope"></i> <span
                                th:text="${fb.patient.user.email}"></span></span>
                    </div>
                </td>
                <td>
                    <div class="doctor-info" th:if="${fb.doctor != null}">
                        <i class="fa-solid fa-user-doctor text-blue-500"></i>
                        <span th:text="${fb.doctor.fullName}"></span>
                    </div>
                    <span th:if="${fb.doctor == null}" style="color: #94a3b8; font-style: italic; font-size: 14px;">Không có</span>
                </td>
                <td>
                    <div class="rating-stars" th:if="${fb.rating != null}">
                        <th:block th:each="i : ${#numbers.sequence(1, fb.rating)}"><i class="fa-solid fa-star"></i>
                        </th:block>
                    </div>
                    <span th:if="${fb.rating == null}" style="color: #94a3b8; font-style: italic; font-size: 14px;">Chưa đánh giá</span>
                </td>
                <td class="feedback-date">
                    <span th:text="${#temporals.format(fb.createdAt, 'dd/MM/yyyy')}"></span><br>
                    <span style="font-size: 12px; color: #94a3b8;"
                          th:text="${#temporals.format(fb.createdAt, 'HH:mm')}"></span>
                </td>
                <td>
                    <div class="feedback-content" th:text="${fb.content}"></div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(feedbacks)}">
                <td colspan="5" class="empty-state">
                    <i class="fa-regular fa-folder-open text-4xl mb-3" style="display: block; color: #cbd5e1;"></i>
                    Chưa có đánh giá nào từ bệnh nhân.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>

</html>

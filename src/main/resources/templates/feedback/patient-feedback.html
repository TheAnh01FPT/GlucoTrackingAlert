<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đánh Giá Của Bệnh Nhân</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #1a6b5a; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 20px; }
        .alert-error { background: #fee2e2; color: #991b1b; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .alert-success { background: #dcfce7; color: #166534; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        
        .feedback-form { margin-bottom: 40px; }
        textarea { width: 100%; height: 120px; padding: 15px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 15px; font-family: inherit; resize: vertical; }
        button { background: #27ae60; color: #fff; border: none; padding: 10px 25px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 15px; }
        button:hover { background: #219653; }
        
        .feedback-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-bottom: 15px; }
        .feedback-header { font-size: 13px; color: #64748b; margin-bottom: 10px; }
        .feedback-content { font-size: 15px; color: #334155; margin-bottom: 15px; line-height: 1.5; }
        .action-buttons { margin-top: 10px; }
        .btn-sm { padding: 5px 12px; font-size: 13px; border-radius: 4px; cursor: pointer; border: none; margin-right: 5px; }
        .btn-edit { background: #3b82f6; color: white; }
        .btn-delete { background: #ef4444; color: white; }
        .edit-form { display: none; margin-top: 15px; }
        .edit-form textarea { height: 80px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Gửi Ý Kiến Phản Hồi / Đánh Giá</h2>
        
        <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>

        <div th:if="${canFeedback}" class="feedback-form">
            <form action="/patient/feedbacks/submit" method="post">
                <textarea name="content" placeholder="Nhập ý kiến đánh giá của bạn tại đây (chúng tôi luôn lắng nghe để cải thiện dịch vụ)..." required></textarea>
                <button type="submit">Gửi đánh giá</button>
            </form>
        </div>
        <div th:unless="${canFeedback}" class="alert-error">
            Bạn cần phải nhận ít nhất một lời khuyên từ bác sĩ trước khi có thể gửi ý kiến đánh giá.
        </div>

        <h3 style="margin-top: 40px; margin-bottom: 20px; color: #334155;">Lịch sử đánh giá của bạn</h3>
        <div th:if="${#lists.isEmpty(feedbacks)}">
            <p style="color: #64748b; font-style: italic;">Bạn chưa có đánh giá nào.</p>
        </div>
        
        <div th:each="fb : ${feedbacks}" class="feedback-item">
            <div class="feedback-header">
                Đã gửi vào: <span th:text="${#temporals.format(fb.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
            </div>
            <div class="feedback-content" th:id="'content-' + ${fb.id}" th:text="${fb.content}"></div>
            
            <div class="action-buttons">
                <button type="button" class="btn-sm btn-edit" th:onclick="'toggleEdit(' + ${fb.id} + ')'">Sửa</button>
                <form action="/patient/feedbacks/delete" method="post" style="display:inline;" onsubmit="return confirm('Bạn có chắc chắn muốn xóa đánh giá này không?');">
                    <input type="hidden" name="feedbackId" th:value="${fb.id}">
                    <button type="submit" class="btn-sm btn-delete">Xóa</button>
                </form>
            </div>

            <div class="edit-form" th:id="'edit-form-' + ${fb.id}">
                <form action="/patient/feedbacks/update" method="post">
                    <input type="hidden" name="feedbackId" th:value="${fb.id}">
                    <textarea name="content" required th:text="${fb.content}"></textarea>
                    <button type="submit" class="btn-sm" style="background: #27ae60; color: white;">Lưu thay đổi</button>
                    <button type="button" class="btn-sm" style="background: #64748b; color: white;" th:onclick="'toggleEdit(' + ${fb.id} + ')'">Hủy</button>
                </form>
            </div>
        </div>
        
        <div style="margin-top: 30px;">
            <a href="/patient/homepage" style="color: #27ae60; text-decoration: none;">&larr; Quay lại trang chủ</a>
        </div>
    </div>
    <script>
        function toggleEdit(id) {
            var form = document.getElementById('edit-form-' + id);
            var content = document.getElementById('content-' + id);
            if (form.style.display === 'none' || form.style.display === '') {
                form.style.display = 'block';
                content.style.display = 'none';
            } else {
                form.style.display = 'none';
                content.style.display = 'block';
            }
        }
    </script>
</body>
</html>

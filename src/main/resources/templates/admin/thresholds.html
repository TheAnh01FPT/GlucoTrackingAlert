<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Quản lý ngưỡng sức khỏe</title>
    <link rel="stylesheet" th:href="@{/css/home.css}" />
</head>
<body>
<div class="container">
    <h1>Quản lý ngưỡng sức khỏe</h1>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <table class="table">
        <thead>
            <tr>
                <th>Patient Type</th>
                <th>Metric</th>
                <th>Normal Min</th>
                <th>Normal Max</th>
                <th>Warning Min</th>
                <th>Warning Max</th>
                <th>Updated At</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${thresholds}">
            <td th:text="${t.patientType}">adult</td>
            <td th:text="${t.metricType}">blood_sugar</td>
            <td th:text="${t.normalMin}">0</td>
            <td th:text="${t.normalMax}">0</td>
            <td th:text="${t.warningMin}">0</td>
            <td th:text="${t.warningMax}">0</td>
            <td th:text="${t.updatedAt}">-</td>
            <td>
                <button type="button" th:attr="data-id=${t.id}"
                        onclick="openEdit(this)" class="btn btn-sm btn-primary">Sửa</button>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Inline edit form (simple) -->
    <div id="editForm" style="display:none; margin-top:20px;">
        <form id="thresholdEditForm" th:action="@{/admin/thresholds/__id__/edit}" method="post">
            <input type="hidden" id="thresholdId" name="id"/>
            <div>
                <label>Normal Min</label>
                <input type="text" id="normalMin" name="normalMin"/>
            </div>
            <div>
                <label>Normal Max</label>
                <input type="text" id="normalMax" name="normalMax"/>
            </div>
            <div>
                <label>Warning Min</label>
                <input type="text" id="warningMin" name="warningMin"/>
            </div>
            <div>
                <label>Warning Max</label>
                <input type="text" id="warningMax" name="warningMax"/>
            </div>
            <div>
                <label>Description</label>
                <input type="text" id="description" name="description"/>
            </div>
            <div style="margin-top:10px;">
                <button type="submit" class="btn btn-primary">Lưu</button>
                <button type="button" onclick="closeEdit()" class="btn btn-secondary">Hủy</button>
            </div>
        </form>
    </div>
</div>

<script>
    function openEdit(btn) {
        var id = btn.getAttribute('data-id');
        var row = btn.closest('tr');
        document.getElementById('thresholdId').value = id;
        document.getElementById('normalMin').value = row.children[2].innerText.trim();
        document.getElementById('normalMax').value = row.children[3].innerText.trim();
        document.getElementById('warningMin').value = row.children[4].innerText.trim();
        document.getElementById('warningMax').value = row.children[5].innerText.trim();
        document.getElementById('description').value = '';
        var form = document.getElementById('thresholdEditForm');
        form.action = '/admin/thresholds/' + id + '/edit';
        document.getElementById('editForm').style.display = 'block';
        window.scrollTo(0, document.getElementById('editForm').offsetTop);
    }
    function closeEdit() {
        document.getElementById('editForm').style.display = 'none';
    }
</script>
</body>
</html>

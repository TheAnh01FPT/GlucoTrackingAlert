<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Thêm/Sửa Banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
          rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/banner-admin.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
</head>
<body class="admin-layout-body">

<!-- 1. SIDEBAR DUY NHẤT -->
<div th:replace="~{fragments/layout :: sidebar('banners')}"></div>

<!-- 2. KHU VỰC NỘI DUNG CHÍNH (MAIN) -->
<div class="main">
    <div th:replace="~{fragments/layout :: topbar(${banner != null && banner.id != null ? 'Sửa Thông Tin Banner' : 'Thêm Banner Mới'})}"></div>

    <!-- Form nhập liệu -->
    <div class="form-container">
        <form th:action="@{/admin/banners/save}" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="id" th:value="${banner?.id}">

            <div class="form-group">
                <label>Tiêu đề chính:</label>
                <input type="text" name="title" class="form-control" th:value="${banner?.title}" maxlength="150"
                       required placeholder="Nhập tiêu đề banner...">
            </div>

            <div class="form-group">
                <label>Phụ đề / Mô tả ngắn:</label>
                <textarea name="subtitle" class="form-control" rows="3" maxlength="500"
                          placeholder="Nhập mô tả chi tiết..." th:text="${banner?.subtitle}"></textarea>
            </div>

            <div class="form-group">
                <label>Đường dẫn khi click (Redirect URL):</label>
                <input type="text" name="redirectUrl" id="redirectUrl" class="form-control"
                       th:value="${banner?.redirectUrl}" maxlength="2048" placeholder="https://example.com">
            </div>

            <div class="form-group">
                <label>Thứ tự hiển thị (1, 2, 3... nhỏ nhất lên trước):</label>
                <input type="number" id="displayOrder" name="displayOrder" class="form-control"
                       th:value="${banner?.displayOrder != null ? banner.displayOrder : 1}" min="1" max="9999" required>
            </div>

            <div class="form-group form-checkbox">
                <input type="checkbox" id="status" name="status" th:checked="${banner == null || banner.status}">
                <label for="status">Kích hoạt hiển thị (Active)</label>
            </div>

            <div class="form-group">
                <label>Tải ảnh Banner (chỉ chọn nếu muốn thay đổi ảnh):</label>
                <input type="file" id="imageFile" name="imageFile" class="form-control" accept=".jpg,.jpeg,.png,.webp"
                       th:required="${banner == null || banner.id == null}">

                <div th:if="${banner != null && banner.imageUrl != null}" style="margin-top: 15px;">
                    <p style="font-size: 13px; color: #64748b; margin-bottom: 5px;">Ảnh hiện tại:</p>
                    <img th:src="${banner.imageUrl}" alt="Current Banner"
                         style="max-height: 120px; border-radius: 6px; border: 1px solid #cbd5e1;">
                </div>
            </div>

            <div class="form-actions">
                <a href="/admin/banners" class="btn-cancel">Hủy Bỏ</a>
                <button type="submit" class="btn-primary-custom">💾 Lưu Banner</button>
            </div>
        </form>
    </div>
</div>

<script>
    document.querySelector('form').addEventListener('submit', function (e) {
        const orderInput = document.getElementById('displayOrder');
        const urlInput = document.getElementById('redirectUrl');
        const fileInput = document.getElementById('imageFile');

        if (orderInput.value < 1 || orderInput.value >= 10000) {
            e.preventDefault();
            alert("Thứ tự hiển thị phải từ 1 đến 9999!");
            orderInput.focus();
            return;
        }

        if (urlInput.value && urlInput.value.trim() !== "") {
            const urlValue = urlInput.value.trim();
            if (!urlValue.startsWith("http://") && !urlValue.startsWith("https://")) {
                e.preventDefault();
                alert("Đường dẫn (URL) phải bắt đầu bằng http:// hoặc https://");
                urlInput.focus();
                return;
            }
        }

        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const validExts = ['image/jpeg', 'image/png', 'image/webp', 'image/jpg'];
            if (!validExts.includes(file.type)) {
                e.preventDefault();
                alert("Chỉ chấp nhận các định dạng ảnh .jpg, .jpeg, .png, .webp!");
                return;
            }
            if (file.size > 5 * 1024 * 1024) {
                e.preventDefault();
                alert("Kích thước file không được vượt quá 5MB!");
                return;
            }
        }
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GlucoTrackAlert - Quản Lý Banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
          rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/banner-admin.css}">
    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
</head>
<body class="admin-layout-body">

<div th:replace="~{fragments/layout :: sidebar('banners')}"></div>

<div class="main">
    <div th:replace="~{fragments/layout :: topbar('Quản Lý Banner Trang Chủ')}"></div>

    <div style="display: flex; justify-content: flex-end; margin-bottom: 20px;">
        <button type="button" class="btn btn-primary px-3 py-2"
                style="background-color: #1a6b5a; border: none; font-weight: 600; font-size: 14px; border-radius: 8px;"
                onclick="openCreateModal()">
            <i class="bi bi-plus-lg me-1"></i> Thêm Banner Mới
        </button>
    </div>

    <!-- Thông báo Alert -->
    <div id="successAlert" th:if="${successMessage}" class="alert alert-success" role="alert"><span
            th:text="${successMessage}"></span></div>
    <div id="errorAlert" th:if="${errorMessage}" class="alert alert-danger" role="alert"><span
            th:text="${errorMessage}"></span></div>

    <div class="custom-table-wrap table-responsive">
        <table class="table align-middle">
            <thead>
            <tr>
                <th style="width: 8%;">ID</th>
                <th style="width: 15%;">Ảnh</th>
                <th style="width: 30%;">Tiêu đề</th>
                <th style="width: 12%;">Thứ tự</th>
                <th style="width: 15%;">Trạng thái</th>
                <th style="width: 20%; text-align: center;">Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="banner : ${banners}">
                <td th:text="${banner.id}" style="font-weight: 600; color: #64748b;">1</td>
                <td>
                    <img th:src="${banner.imageUrl}" alt="Banner"
                         style="max-height: 40px; border-radius: 6px; border: 1px solid #cbd5e1;">
                </td>
                <td th:text="${banner.title}" style="font-weight: 500;">Banner 1</td>
                <td th:text="${banner.displayOrder}">0</td>
                <td>
                    <span th:text="${banner.status ? 'Hoạt động' : 'Tạm ẩn'}"
                          th:class="${banner.status ? 'badge-status badge-active' : 'badge-status badge-inactive'}">Hoạt động</span>
                </td>
                <td style="white-space: nowrap; text-align: center;">
                    <button type="button" class="btn-action-edit me-1"
                            th:onclick="openEditModal([[${banner.id}]], [[${banner.title}]], [[${banner.subtitle}]], [[${banner.redirectUrl}]], [[${banner.displayOrder}]], [[${banner.status}]], [[${banner.imageUrl}]])">
                        <i class="bi bi-pencil-square"></i> Sửa
                    </button>
                    <a th:href="@{/admin/banners/delete/{id}(id=${banner.id})}" class="btn-action-delete"
                       onclick="return confirm('Bạn có chắc chắn muốn xóa banner này?');">
                        <i class="bi bi-trash"></i> Xóa
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(banners)}">
                <td colspan="6" style="text-align: center; color: #94a3b8; padding: 40px;">Hệ thống chưa có banner
                    nào.
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Paging -->
        <div th:if="${totalPages > 0}"
             style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid #f1f5f9;">
            <span style="font-size: 13px; color: #64748b;">
                Hiển thị trang <strong th:text="${currentPage + 1}"></strong> / <strong
                    th:text="${totalPages}"></strong>
            </span>

            <form th:action="@{/admin/banners}" method="get"
                  style="margin: 0; display: flex; align-items: center; gap: 8px;">
                <input type="hidden" name="page" th:value="${currentPage}"/>
                <label for="sizeSelect" style="font-size: 13px; color: #64748b;">Số mục:</label>
                <select id="sizeSelect" name="size" th:onchange="this.form.submit()" class="custom-select-size">
                    <option th:value="5" th:selected="${pageSize == 5}">5</option>
                    <option th:value="10" th:selected="${pageSize == 10}">10</option>
                    <option th:value="15" th:selected="${pageSize == 15}">15</option>
                    <option th:value="20" th:selected="${pageSize == 20}">20</option>
                </select>
            </form>

            <div style="display: flex; gap: 6px;">
                <a th:if="${currentPage > 0}" th:href="@{/admin/banners(page=${currentPage - 1}, size=${pageSize})}"
                   style="padding: 7px 14px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; text-decoration: none; color: #334155;">←</a>
                <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                    <a th:href="@{/admin/banners(page=${i}, size=${pageSize})}" th:text="${i + 1}"
                       th:style="${i == currentPage} ? 'padding: 7px 14px; background: #3b82f6; color: white; border-radius: 6px; font-size: 13px; text-decoration: none;' : 'padding: 7px 14px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; text-decoration: none; color: #334155;'"></a>
                </th:block>
                <a th:if="${currentPage < totalPages - 1}"
                   th:href="@{/admin/banners(page=${currentPage + 1}, size=${pageSize})}"
                   style="padding: 7px 14px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; text-decoration: none; color: #334155;">→</a>
            </div>
        </div>
    </div>
</div>

<!-- ==================== CẤU TRÚC MODAL THÊM / SỬA BANNER ==================== -->
<div class="modal fade" id="bannerModal" tabindex="-1" aria-labelledby="bannerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl" style="max-width: 1100px; width: 95%;">
        <div class="modal-content" style="border-radius: 14px; border: none; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2); overflow: hidden;">
            <div class="modal-header px-4 py-3" style="background: linear-gradient(135deg, #1a6b5a, #134d40); color: #ffffff;">
                <h5 class="modal-title" id="bannerModalLabel" style="font-weight: 700; color: #ffffff; font-size: 1.25rem;">🖼️ Cấu Hình Banner</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/admin/banners/save}" method="POST" enctype="multipart/form-data" id="bannerForm">
                <div class="modal-body p-4">
                    <input type="hidden" name="id" id="bannerId">

                    <div class="row">
                        <div class="col-md-8 mb-3">
                            <label class="form-label fw-bold" style="color: #334155;">Tiêu đề chính <span class="text-danger">*</span>:</label>
                            <input type="text" name="title" id="bannerTitle" class="form-control form-control-lg" maxlength="150" required
                                   placeholder="Nhập tiêu đề banner..." style="font-size: 15px; border-radius: 8px;">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold" style="color: #334155;">Thứ tự hiển thị <span class="text-danger">*</span>:</label>
                            <input type="number" name="displayOrder" id="bannerDisplayOrder" class="form-control form-control-lg"
                                   min="1" max="9999" required style="font-size: 15px; border-radius: 8px;">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold" style="color: #334155;">Phụ đề / Mô tả ngắn:</label>
                        <textarea name="subtitle" id="bannerSubtitle" class="form-control" rows="3" maxlength="500"
                                  placeholder="Nhập mô tả chi tiết nội dung thông điệp banner..." style="font-size: 14px; border-radius: 8px;"></textarea>
                    </div>

                    <div class="row align-items-center">
                        <div class="col-md-8 mb-3">
                            <label class="form-label fw-bold" style="color: #334155;">Đường dẫn chuyển hướng (Redirect URL):</label>
                            <input type="text" name="redirectUrl" id="bannerRedirectUrl" class="form-control"
                                   maxlength="2048" placeholder="https://example.com/khuyen-mai" style="font-size: 14px; border-radius: 8px;">
                        </div>
                        <div class="col-md-4 mb-3 pt-md-3">
                            <div class="form-check p-2 rounded border" style="background-color: #f8fafc; border-color: #e2e8f0 !important;">
                                <input type="checkbox" class="form-check-input ms-1" id="bannerStatus" name="status" value="true" style="transform: scale(1.2); cursor: pointer;">
                                <label class="form-check-label ms-2 fw-semibold" for="bannerStatus" style="font-size: 14px; cursor: pointer; color: #1e293b;">
                                    Kích hoạt hiển thị (Active)
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold" id="uploadLabel" style="color: #334155;">Tải ảnh Banner mới (Khuyên dùng tỉ lệ 16:9 hoặc 21:9):</label>
                        <input type="file" name="imageFile" id="bannerImageFile" class="form-control form-control-lg"
                               accept=".jpg,.jpeg,.png,.webp" style="font-size: 14px; border-radius: 8px;">

                        <div id="currentImageWrapper" class="mt-3 p-3 border rounded bg-light" style="display: none;">
                            <p class="fw-bold mb-2" style="font-size: 13px; color: #475569;">🖼️ Xem trước ảnh hiện tại:</p>
                            <div class="text-center bg-dark p-2 rounded" style="max-height: 240px; overflow: hidden; display: inline-block;">
                                <img src="" id="previewImage" alt="Current Banner"
                                     style="max-height: 220px; max-width: 100%; object-fit: contain; border-radius: 6px;">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light px-4 py-3" style="border-top: 1px solid #e2e8f0;">
                    <button type="button" class="btn btn-secondary px-4 py-2" data-bs-dismiss="modal"
                            style="font-size: 14px; font-weight: 600; border-radius: 8px;">Hủy Bỏ
                    </button>
                    <button type="submit" class="btn btn-primary px-4 py-2"
                            style="background-color: #1a6b5a; border: none; font-size: 14px; font-weight: 600; border-radius: 8px;">💾 Lưu Banner
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let myModal;
    document.addEventListener("DOMContentLoaded", function () {
        myModal = new bootstrap.Modal(document.getElementById('bannerModal'));
    });

    function openCreateModal() {
        document.getElementById('bannerModalLabel').innerText = "🖼️ Thêm Banner Mới";
        document.getElementById('bannerForm').reset();
        document.getElementById('bannerId').value = "";
        document.getElementById('bannerDisplayOrder').value = "1";
        document.getElementById('bannerStatus').checked = true;
        document.getElementById('bannerImageFile').required = true;
        document.getElementById('uploadLabel').innerText = "Tải ảnh Banner (Bắt buộc):";
        document.getElementById('currentImageWrapper').style.display = 'none';
        myModal.show();
    }

    function openEditModal(id, title, subtitle, redirectUrl, displayOrder, status, imageUrl) {
        document.getElementById('bannerModalLabel').innerText = "🖼️ Sửa Thông Tin Banner";
        document.getElementById('bannerId').value = id;
        document.getElementById('bannerTitle').value = title;
        document.getElementById('bannerSubtitle').value = subtitle || "";
        document.getElementById('bannerRedirectUrl').value = redirectUrl || "";
        document.getElementById('bannerDisplayOrder').value = displayOrder;
        document.getElementById('bannerStatus').checked = status;
        document.getElementById('bannerImageFile').required = false;
        document.getElementById('uploadLabel').innerText = "Tải ảnh Banner mới (chỉ chọn nếu muốn thay đổi ảnh):";

        if (imageUrl) {
            document.getElementById('previewImage').src = imageUrl;
            document.getElementById('currentImageWrapper').style.display = 'block';
        } else {
            document.getElementById('currentImageWrapper').style.display = 'none';
        }
        myModal.show();
    }

    // Validation form trước khi submit
    document.getElementById('bannerForm').addEventListener('submit', function (e) {
        const orderInput = document.getElementById('bannerDisplayOrder');
        const urlInput = document.getElementById('bannerRedirectUrl');
        const fileInput = document.getElementById('bannerImageFile');

        if (orderInput.value < 1 || orderInput.value >= 10000) {
            e.preventDefault();
            alert("Thứ tự hiển thị phải từ 1 đến 9999!");
            orderInput.focus();
            return;
        }

        if (urlInput.value && urlInput.value.trim() !== "") {
            const urlValue = urlInput.value.trim();
            if (!urlValue.startsWith("http://") && !urlValue.startsWith("https://")) {
                e.preventDefault();
                alert("Đường dẫn (URL) phải bắt đầu bằng http:// hoặc https://");
                urlInput.focus();
                return;
            }
        }

        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const validExts = ['image/jpeg', 'image/png', 'image/webp', 'image/jpg'];
            if (!validExts.includes(file.type)) {
                e.preventDefault();
                alert("Chỉ chấp nhận các định dạng ảnh .jpg, .jpeg, .png, .webp!");
                return;
            }
            if (file.size > 5 * 1024 * 1024) {
                e.preventDefault();
                alert("Kích thước file không được vượt quá 5MB!");
                return;
            }
        }
    });

    setTimeout(() => {
        const successAlert = document.getElementById('successAlert');
        const errorAlert = document.getElementById('errorAlert');
        if (successAlert) {
            successAlert.style.display = 'none';
        }
        if (errorAlert) {
            errorAlert.style.display = 'none';
        }
    }, 4000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin tức & Bài viết Y khoa - GlucoTrackAlert</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #1a6b5a;
            --primary-light: #e8f5f1;
            --primary-dark: #134d40;
            --accent: #27ae60;
            --dark: #2c3e50;
            --light: #f8f9fa;
            --gray-200: #e9ecef;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: var(--light);
            color: var(--dark);
        }

        /* Navbar */
        .navbar {
            background: linear-gradient(135deg, rgba(26, 107, 90, 0.95) 0%, rgba(19, 77, 64, 0.95) 100%);
            box-shadow: 0 2px 8px rgba(26, 107, 90, 0.15);
            padding: 1rem 0;
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: white !important;
        }

        /* Main container */
        .container {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 1rem;
        }

        /* Header section */
        .articles-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .articles-header h1 {
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .articles-header p {
            color: #6c757d;
            font-size: 1.1rem;
        }

        /* Filter section */
        .filter-section {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
        }

        .filter-section .row {
            gap: 1rem;
        }

        .filter-section input,
        .filter-section select {
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            padding: 0.75rem;
            font-size: 0.95rem;
        }

        .filter-section input:focus,
        .filter-section select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 107, 90, 0.1);
            outline: none;
        }

        .btn-search {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-search:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 107, 90, 0.3);
        }

        .btn-reset {
            background: var(--gray-200);
            color: var(--dark);
            border: none;
            border-radius: 8px;
            padding: 0.75rem 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-reset:hover {
            background: #d9dee3;
        }

        /* Article grid */
        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .article-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .article-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 16px rgba(26, 107, 90, 0.15);
        }

        .article-card-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, var(--primary-light), #c8e6e0);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .article-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .article-card-image-placeholder {
            font-size: 3rem;
            color: var(--primary);
        }

        .article-card-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .article-category {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            margin-bottom: 0.8rem;
            width: fit-content;
        }

        .article-card-title {
            color: var(--primary);
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.8rem;
            line-height: 1.4;
            flex: 1;
        }

        .article-card-summary {
            color: #6c757d;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1rem;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .article-card-date {
            font-size: 0.85rem;
            color: #adb5bd;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .article-card-link {
            display: inline-block;
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
            margin-top: auto;
            transition: color 0.3s ease;
        }

        .article-card-link:hover {
            color: var(--primary-dark);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 12px;
        }

        .empty-state-icon {
            font-size: 3rem;
            color: var(--gray-200);
            margin-bottom: 1rem;
        }

        .empty-state-text {
            color: #6c757d;
            font-size: 1.1rem;
        }

        /* Pagination */
        .pagination {
            justify-content: center;
            gap: 0.5rem;
            margin-top: 3rem;
        }

        .page-link {
            color: var(--primary);
            border: 1px solid var(--gray-200);
            border-radius: 6px;
            padding: 0.5rem 0.8rem;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .page-link:hover {
            background: var(--primary-light);
            border-color: var(--primary);
        }

        .page-link.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .page-link.disabled {
            color: #adb5bd;
            pointer-events: none;
        }

        /* Footer */
        footer {
            background: var(--dark);
            color: white;
            text-align: center;
            padding: 2rem;
            margin-top: 4rem;
        }

        @media (max-width: 768px) {
            .articles-grid {
                grid-template-columns: 1fr;
            }

            .filter-section {
                padding: 1.5rem;
            }

            .articles-header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/">
                <i class="bi bi-heart-pulse"></i> GlucoTrackAlert
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/">Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white active" href="/articles">Tin tức</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <!-- Header -->
        <div class="articles-header">
            <h1><i class="bi bi-newspaper"></i> Tin tức & Bài viết Y khoa</h1>
            <p>Cập nhật kiến thức sức khỏe từ các chuyên gia</p>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <form method="get" action="/articles" class="row align-items-end">
                <div class="col-12 col-md-6">
                    <label class="form-label fw-600">Tìm kiếm bài viết</label>
                    <input type="text" name="keyword" class="form-control" 
                           placeholder="Nhập từ khóa..." th:value="${keyword}">
                </div>
                <div class="col-12 col-md-3">
                    <label class="form-label fw-600">Danh mục</label>
                    <select name="category" class="form-select">
                        <option value="">-- Tất cả danh mục --</option>
                        <option th:each="cat : ${categories}" th:value="${cat}" 
                                th:text="${cat}" th:selected="${category == cat}"></option>
                    </select>
                </div>
                <div class="col-12 col-md-3">
                    <button type="submit" class="btn btn-search w-100">
                        <i class="bi bi-search"></i> Tìm kiếm
                    </button>
                </div>
            </form>
        </div>

        <!-- Articles Grid -->
        <div th:if="${articles.hasContent()}">
            <div class="articles-grid">
                <div th:each="article : ${articles.content}" class="article-card">
                    <div class="article-card-image">
                        <img th:if="${article.thumbnailUrl}" th:src="${article.thumbnailUrl}" alt="Thumbnail">
                        <div th:if="!${article.thumbnailUrl}" class="article-card-image-placeholder">
                            <i class="bi bi-newspaper"></i>
                        </div>
                    </div>
                    <div class="article-card-body">
                        <span class="article-category" th:text="${article.category ?: 'Tin tức'}"></span>
                        <h5 class="article-card-title" th:text="${article.title}"></h5>
                        <p class="article-card-summary" th:text="${article.summary}"></p>
                        <p class="article-card-date">
                            <i class="bi bi-calendar-event"></i>
                            <span th:text="${#temporals.format(article.publishedAt, 'dd/MM/yyyy')}"></span>
                        </p>
                        <a th:href="'/articles/' + ${article.slug}" class="article-card-link">
                            Đọc thêm <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Pagination -->
            <nav th:if="${articles.totalPages > 1}">
                <ul class="pagination">
                    <li th:class="'page-item ' + (${articles.first} ? 'disabled' : '')">
                        <a class="page-link" th:href="'/articles?page=0&keyword=' + ${keyword} + '&category=' + ${category ?: ''}">
                            <i class="bi bi-chevron-double-left"></i>
                        </a>
                    </li>
                    <li th:class="'page-item ' + (${articles.first} ? 'disabled' : '')">
                        <a class="page-link" th:href="'/articles?page=' + (${currentPage} - 1) + '&keyword=' + ${keyword} + '&category=' + ${category ?: ''}">
                            <i class="bi bi-chevron-left"></i> Trước
                        </a>
                    </li>

                    <li th:each="pageNum : ${#numbers.sequence(0, articles.totalPages - 1)}" 
                        th:class="'page-item ' + (${pageNum} == ${currentPage} ? 'active' : '')">
                        <a class="page-link" th:href="'/articles?page=' + ${pageNum} + '&keyword=' + ${keyword} + '&category=' + ${category ?: ''}"
                           th:text="${pageNum + 1}"></a>
                    </li>

                    <li th:class="'page-item ' + (${articles.last} ? 'disabled' : '')">
                        <a class="page-link" th:href="'/articles?page=' + (${currentPage} + 1) + '&keyword=' + ${keyword} + '&category=' + ${category ?: ''}">
                            Sau <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                    <li th:class="'page-item ' + (${articles.last} ? 'disabled' : '')">
                        <a class="page-link" th:href="'/articles?page=' + (${articles.totalPages} - 1) + '&keyword=' + ${keyword} + '&category=' + ${category ?: ''}">
                            <i class="bi bi-chevron-double-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <!-- Empty State -->
        <div th:if="!${articles.hasContent()}" class="empty-state">
            <div class="empty-state-icon">
                <i class="bi bi-inbox"></i>
            </div>
            <p class="empty-state-text">Không tìm thấy bài viết nào phù hợp.</p>
            <p class="empty-state-text" style="font-size: 0.9rem; color: #adb5bd;">
                <a href="/articles" style="color: var(--primary); text-decoration: none;">Xem toàn bộ bài viết</a>
            </p>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 GlucoTrackAlert. Theo dõi sức khỏe của bạn mỗi ngày.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

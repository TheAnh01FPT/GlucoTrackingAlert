<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GlucoTrackAlert - Quản Trị Người Dùng</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f1f5f9; margin: 0; padding: 30px; color: #1e293b; }
        .dashboard-header { margin-bottom: 25px; border-left: 5px solid #3b82f6; padding-left: 15px; }
        .dashboard-header h1 { margin: 0; font-size: 24px; color: #0f172a; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); margin-bottom: 35px; }
        h2 { color: #1e293b; margin-top: 0; margin-bottom: 20px; font-size: 18px; display: flex; align-items: center; gap: 10px; }

        /* Form */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; background: #f8fafc; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 13px; font-weight: 600; color: #64748b; }
        .form-control { padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; background-color: white; }
        .form-control:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
        .form-checkbox { flex-direction: row; align-items: center; gap: 10px; margin-top: 25px; }
        .form-checkbox input { width: 18px; height: 18px; cursor: pointer; }

        /* Table */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; color: #475569; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.05em; }
        tr:hover { background-color: #f8fafc; }

        /* Badges & Buttons */
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; display: inline-block; }
        .badge-active { background-color: #dcfce7; color: #15803d; }
        .badge-pending { background-color: #fef9c3; color: #a16207; }
        .badge-banned { background-color: #fee2e2; color: #b91c1c; }

        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; transition: all 0.2s; }
        .btn-blue { background-color: #3b82f6; color: white; }
        .btn-blue:hover { background-color: #2563eb; }

        .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 4px; margin-right: 5px; text-decoration: none; font-weight: 500; }
        .btn-edit { background-color: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
        .btn-edit:hover { background-color: #e2e8f0; }
        .btn-delete { background-color: #fee2e2; color: #ef4444; }
        .btn-delete:hover { background-color: #fca5a5; }

        .form-actions { display: flex; align-items: flex-end; }
        .cancel-edit { color: #64748b; font-size: 13px; margin-left: 10px; cursor: pointer; text-decoration: underline; display: none; }
    </style>
</head>
<body>

<div class="dashboard-header">
    <h1>Hệ Thống Quản Trị Hệ Thống (Phân Hệ Đối Tượng Y Tế)</h1>
</div>

<div class="container">
    <h2 style="color: #3b82f6;">👤 Quản Lý Tài Khoản (Bệnh Nhân & Bác Sĩ)</h2>

    <form th:action="@{/admin/users/save}" method="POST">
        <input type="hidden" id="userFormId" name="id">

        <div class="form-grid">
            <div class="form-group">
                <label for="userEmail">Email người dùng:</label>
                <input type="email" id="userEmail" name="email" class="form-control" placeholder="example@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="userPassword" id="passwordLabel">Mật khẩu khởi tạo:</label>
                <input type="password" id="userPassword" name="password" class="form-control" placeholder="Nhập mật khẩu" required>
            </div>
            <div class="form-group">
                <label for="userStatus">Trạng thái:</label>
                <select id="userStatus" name="status" class="form-control">
                    <option value="active">Active (Hoạt động)</option>
                    <option value="pending_verification">Pending Verification</option>
                    <option value="banned">Banned (Khóa)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="userRole">Vai trò hệ thống (Role):</label>
                <select id="userRole" name="roleName" class="form-control">
                    <option value="PATIENT">PATIENT (Bệnh nhân)</option>
                    <option value="DOCTOR">DOCTOR (Bác sĩ chuyên khoa)</option>
                </select>
            </div>

            <div class="form-group form-checkbox">
                <input type="checkbox" id="userEmailVerified" name="emailVerified" value="true" checked>
                <label for="userEmailVerified">Đã xác thực Email</label>
            </div>
            <div class="form-actions">
                <button type="submit" id="btnSubmitUser" class="btn btn-blue">💾 Lưu Thông Tin</button>
                <span id="cancelUserEdit" class="cancel-edit" onclick="resetUserForm()">Hủy sửa</span>
            </div>
        </div>
    </form>

    <table>
        <thead>
        <tr>
            <th style="width: 8%;">ID</th>
            <th style="width: 32%;">Email</th>
            <th style="width: 20%;">Vai trò (Role)</th>
            <th style="width: 15%;">Trạng thái</th>
            <th style="width: 15%;">Xác thực Email</th>
            <th style="width: 10%;">Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}">1</td>
            <td th:text="${user.email}" style="font-weight: 500;">user@gmail.com</td>
            <td>
                <span th:text="${user.role != null ? user.role.name : 'Chưa gán'}"
                      th:class="${user.role != null && user.role.name == 'DOCTOR'} ? 'badge' : 'badge'"
                      th:style="${user.role != null && user.role.name == 'DOCTOR'} ? 'background-color: #e0f2fe; color: #0369a1;' : 'background-color: #f3e8ff; color: #6b21a8;'">
                    PATIENT
                </span>
            </td>
            <td>
                <span th:text="${user.status}"
                      th:class="${user.status == 'active' ? 'badge badge-active' : (user.status == 'banned' ? 'badge badge-banned' : 'badge badge-pending')}">active</span>
            </td>
            <td th:text="${user.emailVerified ? 'Đã xác thực ✔' : 'Chưa xác thực ❌'}">Đã xác thực</td>
            <td>
                <a href="#" class="btn-sm btn-edit"
                   th:onclick="fillUserToForm([[${user.id}]], [[${user.email}]], [[${user.status}]], [[${user.role != null ? user.role.name : ''}]], [[${user.emailVerified}]])">Sửa</a>
                <a th:href="@{/admin/users/delete/{id}(id=${user.id})}" class="btn-sm btn-delete"
                   onclick="return confirm('Bạn có chắc chắn muốn xóa tài khoản này không?');">Xóa</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(users)}">
            <td colspan="6" style="text-align: center; color: #94a3b8; padding: 30px;">Hệ thống chưa có tài khoản Bệnh nhân hoặc Bác sĩ nào.</td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    // Điều khiển điền dữ liệu ngược lại Form để sửa thông tin
    function fillUserToForm(id, email, status, roleName, emailVerified) {
        document.getElementById('userFormId').value = id;
        document.getElementById('userEmail').value = email;
        document.getElementById('userStatus').value = status;
        document.getElementById('userRole').value = roleName.toUpperCase();
        document.getElementById('userEmailVerified').checked = emailVerified;

        document.getElementById('userPassword').required = false;
        document.getElementById('userPassword').placeholder = "Bỏ trống nếu giữ nguyên mật khẩu cũ";
        document.getElementById('passwordLabel').innerText = "Cập nhật mật khẩu mới:";
        document.getElementById('btnSubmitUser').innerText = "💾 Cập Nhật Tài Khoản";
        document.getElementById('cancelUserEdit').style.display = "inline-block";
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    // Reset form về trạng thái Thêm mới mặc định
    function resetUserForm() {
        document.getElementById('userFormId').value = "";
        document.getElementById('userEmail').value = "";
        document.getElementById('userPassword').value = "";
        document.getElementById('userPassword').required = true;
        document.getElementById('userPassword').placeholder = "Nhập mật khẩu";
        document.getElementById('passwordLabel').innerText = "Mật khẩu khởi tạo:";
        document.getElementById('userStatus').selectedIndex = 0;
        document.getElementById('userRole').selectedIndex = 0;
        document.getElementById('userEmailVerified').checked = true;
        document.getElementById('btnSubmitUser').innerText = "💾 Lưu Thông Tin";
        document.getElementById('cancelUserEdit').style.display = "none";
    }
</script>

</body>
</html>

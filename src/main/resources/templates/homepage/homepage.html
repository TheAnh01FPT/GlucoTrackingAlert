<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GlucoTrackAlert - Bệnh nhân</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 30px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; }
        .logout { color: #e74c3c; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>
<div class="container">
    <h2>Chào mừng bạn đến GlucoTrackAlert 🎉</h2>
    <p>Trang homepage bệnh nhân đang được xây dựng...</p>
    <p><span class="logout" onclick="logout()">Đăng xuất</span></p>
</div>
<script>
    function logout() {
        localStorage.clear();
        document.cookie = 'jwt=; max-age=0; path=/';
        window.location.href = '/login';
    }
</script>
</body>
</html>

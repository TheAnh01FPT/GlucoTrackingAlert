<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GlucoTrackAlert - Đăng ký</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #7f8c8d; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #2ecc71; border: none; color: white; font-size: 16px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #27ae60; }
        .message { margin-top: 15px; text-align: center; font-size: 14px; padding: 10px; border-radius: 4px; display: none; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .switch-link { text-align: center; margin-top: 15px; font-size: 13px; }
        .switch-link a { color: #3498db; text-decoration: none; }
        #otpSection { display: none; }
        .otp-input { font-size: 24px; text-align: center; letter-spacing: 8px; font-weight: bold; }
        .otp-hint { text-align: center; color: #555; font-size: 14px; margin-bottom: 15px; }
        .resend-link { text-align: center; margin-top: 10px; font-size: 13px; color: #999; }
        .resend-link a { color: #3498db; text-decoration: none; }
    </style>
</head>
<body>
<div class="form-container">

    <!-- Bước 1: Form đăng ký -->
    <div id="registerSection">
        <h2>Đăng Ký Tài Khoản</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Họ và tên</label>
                <input type="text" id="fullName" required placeholder="Nhập họ và tên">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="Nhập email của bạn">
            </div>
            <div class="form-group">
                <label>Số điện thoại</label>
                <input type="tel" id="phone" required placeholder="Nhập số điện thoại">
            </div>
            <div class="form-group">
                <label>Mật khẩu (tối thiểu 6 ký tự)</label>
                <input type="password" id="password" required placeholder="Nhập mật khẩu">
            </div>
            <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword" required placeholder="Nhập lại mật khẩu">
            </div>
            <button type="submit">Đăng ký</button>
        </form>
        <div class="switch-link">
            Đã có tài khoản? <a href="/login">Đăng nhập ngay</a>
        </div>
    </div>

    <!-- Bước 2: Nhập OTP -->
    <div id="otpSection">
        <h2>Xác Nhận Email</h2>
        <p class="otp-hint">Mã xác nhận đã được gửi đến email của bạn. Vui lòng nhập mã bên dưới.</p>
        <div class="form-group">
            <label>Mã xác nhận (6 số)</label>
            <input type="text" id="otpInput" class="otp-input" maxlength="6" placeholder="______">
        </div>
        <button onclick="verifyOtp()">Xác nhận</button>
        <div class="resend-link">
            Không nhận được mã? <a href="#" onclick="resendOtp()">Gửi lại</a>
        </div>
    </div>

    <div id="messageBox" class="message"></div>
</div>

<script>
    let registeredEmail = '';

    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const fullName = document.getElementById('fullName').value;
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const messageBox = document.getElementById('messageBox');

        if (password !== confirmPassword) {
            messageBox.style.display = 'block';
            messageBox.className = 'message error';
            messageBox.innerText = "Mật khẩu xác nhận không khớp!";
            return;
        }

        fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json; charset=UTF-8' },
            body: JSON.stringify({ fullName, email, phone, password })
        })
            .then(async response => {
                const text = await response.text();
                messageBox.style.display = 'block';
                if (response.ok) {
                    registeredEmail = email;
                    document.getElementById('registerSection').style.display = 'none';
                    document.getElementById('otpSection').style.display = 'block';
                    messageBox.className = 'message success';
                    messageBox.innerText = "Mã xác nhận đã gửi đến " + email;
                } else {
                    messageBox.className = 'message error';
                    messageBox.innerText = text || "Đăng ký thất bại.";
                }
            })
            .catch(() => {
                messageBox.style.display = 'block';
                messageBox.className = 'message error';
                messageBox.innerText = "Không thể kết nối đến server.";
            });
    });

    function verifyOtp() {
        const otp = document.getElementById('otpInput').value.trim();
        const messageBox = document.getElementById('messageBox');

        if (otp.length !== 6) {
            messageBox.style.display = 'block';
            messageBox.className = 'message error';
            messageBox.innerText = "Vui lòng nhập đủ 6 số!";
            return;
        }

        fetch(`/api/auth/verify-otp?otp=${otp}`, { method: 'POST' })
            .then(async response => {
                const text = await response.text();
                messageBox.style.display = 'block';
                if (response.ok) {
                    messageBox.className = 'message success';
                    messageBox.innerText = "Xác nhận thành công! Đang chuyển đến trang đăng nhập...";
                    setTimeout(() => window.location.href = '/login', 2000);
                } else {
                    messageBox.className = 'message error';
                    messageBox.innerText = text || "Mã xác nhận không đúng.";
                }
            })
            .catch(() => {
                messageBox.style.display = 'block';
                messageBox.className = 'message error';
                messageBox.innerText = "Không thể kết nối đến server.";
            });
    }

    function resendOtp() {
        const messageBox = document.getElementById('messageBox');
        if (!registeredEmail) {
            messageBox.style.display = 'block';
            messageBox.className = 'message error';
            messageBox.innerText = 'Không xác định được email. Vui lòng đăng ký lại.';
            return;
        }
        fetch(`/api/auth/resend-otp?email=${encodeURIComponent(registeredEmail)}`, { method: 'POST' })
            .then(async response => {
                const text = await response.text();
                messageBox.style.display = 'block';
                if (response.ok) {
                    messageBox.className = 'message success';
                    messageBox.innerText = 'Đã gửi lại mã xác nhận đến ' + registeredEmail;
                } else {
                    messageBox.className = 'message error';
                    messageBox.innerText = text || 'Gửi lại thất bại.';
                }
            })
            .catch(() => {
                messageBox.style.display = 'block';
                messageBox.className = 'message error';
                messageBox.innerText = 'Không thể kết nối đến server.';
            });
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlucoTrackAlert - Đăng nhập</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2c3e50;
        }
        .page-container {
            display: flex;
            width: 900px;
            max-width: 95%;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            min-height: 550px;
        }
        .illustration-side {
            flex: 1;
            background: linear-gradient(135deg, #1a6b5a 0%, #27ae60 100%);
            color: white;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .illustration-side i { font-size: 80px; margin-bottom: 20px; text-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .illustration-side h2 { font-size: 28px; font-weight: 700; margin-bottom: 15px; }
        .illustration-side p { font-size: 15px; line-height: 1.6; opacity: 0.9; }
        
        .form-side {
            flex: 1;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #fff;
        }
        .form-side h2 {
            font-size: 24px;
            font-weight: 700;
            color: #1a6b5a;
            margin-bottom: 10px;
            text-align: center;
        }
        .form-side p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group { margin-bottom: 20px; position: relative; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: #34495e;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            border-color: #27ae60;
            outline: none;
            box-shadow: 0 0 0 4px rgba(39, 174, 96, 0.1);
        }
        .form-group i {
            position: absolute;
            bottom: 14px;
            left: 15px;
            color: #95a5a6;
            font-size: 16px;
            transition: color 0.3s;
        }
        .form-group input:focus + i { color: #27ae60; }
        
        .forgot-pass {
            display: block;
            text-align: right;
            font-size: 13px;
            color: #27ae60;
            text-decoration: none;
            font-weight: 500;
            margin-top: -10px;
            margin-bottom: 20px;
        }
        .forgot-pass:hover { text-decoration: underline; }
        
        button.btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #1a6b5a;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }
        button.btn-submit:hover { background-color: #134d40; }
        button.btn-submit:active { transform: scale(0.98); }
        
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #95a5a6;
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }
        .divider:not(:empty)::before { margin-right: 15px; }
        .divider:not(:empty)::after { margin-left: 15px; }
        
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            background-color: #fff;
            border: 1.5px solid #e2e8f0;
            color: #34495e;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }
        .btn-google img { width: 18px; margin-right: 10px; }
        .btn-google:hover { background-color: #f8fafc; border-color: #cbd5e1; }
        
        .switch-link { text-align: center; margin-top: 25px; font-size: 14px; color: #7f8c8d; }
        .switch-link a { color: #27ae60; text-decoration: none; font-weight: 600; }
        .switch-link a:hover { text-decoration: underline; }
        
        .message { margin-top: 15px; text-align: center; font-size: 13px; padding: 12px; border-radius: 8px; display: none; font-weight: 500; }
        .success { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        @media (max-width: 768px) {
            .page-container { flex-direction: column; width: 100%; min-height: 100vh; border-radius: 0; }
            .illustration-side { padding: 30px; display: none; } /* Hide on mobile to save space */
            .form-side { padding: 40px 20px; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <div class="illustration-side">
            <i class="bi bi-heart-pulse-fill"></i>
            <h2>GlucoTrackAlert</h2>
            <p>Hệ thống theo dõi và cảnh báo đường huyết chủ động. Kết nối bạn bè, bác sĩ và người thân để chăm sóc sức khỏe tốt hơn mỗi ngày.</p>
        </div>
        
        <div class="form-side">
            <h2>Chào mừng trở lại</h2>
            <p class="subtitle">Vui lòng đăng nhập để tiếp tục</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Email của bạn</label>
                    <input type="email" id="email" required placeholder="example@gmail.com">
                    <i class="bi bi-envelope"></i>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="password" required placeholder="Nhập mật khẩu">
                    <i class="bi bi-lock"></i>
                </div>
                
                <a href="/forgot-password" class="forgot-pass">Quên mật khẩu?</a>
                
                <button type="submit" class="btn-submit">Đăng nhập</button>
            </form>
            
            <div id="messageBox" class="message"></div>
            
            <div class="divider">HOẶC</div>
            
            <a href="/oauth2/authorization/google" class="btn-google">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
                Đăng nhập bằng Google
            </a>
            
            <div class="switch-link">
                Chưa có tài khoản? <a href="/register">Đăng ký ngay</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageBox = document.getElementById('messageBox');

            fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: email, password: password})
            })
            .then(async response => {
                messageBox.style.display = 'block';
                if (response.ok) {
                    const data = await response.json();
                    messageBox.className = 'message success';
                    messageBox.innerText = 'Đăng nhập thành công! Đang chuyển hướng...';

                    localStorage.setItem('token', data.token);
                    localStorage.setItem('email', data.email);
                    localStorage.setItem('role', data.role);
                    if (data.doctorId) localStorage.setItem('doctorId', data.doctorId);
                    document.cookie = `jwt=${data.token}; path=/; max-age=86400; SameSite=Strict`;

                    setTimeout(() => {
                        if (data.role === 'ADMIN') window.location.href = '/admin/dashboard';
                        else if (data.role === 'PATIENT') window.location.href = '/patient/homepage';
                        else if (data.role === 'DOCTOR') window.location.href = '/doctor/homepage';
                        else window.location.href = '/login';
                    }, 1000);
                } else {
                    const text = await response.text();
                    messageBox.className = 'message error';
                    messageBox.innerText = text || 'Đăng nhập thất bại.';
                }
            })
            .catch(err => {
                messageBox.style.display = 'block';
                messageBox.className = 'message error';
                messageBox.innerText = 'Không thể kết nối đến server.';
            });
        });
    </script>
</body>
</html>

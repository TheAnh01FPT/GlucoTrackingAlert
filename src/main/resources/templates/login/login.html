<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>GlucoTrackAlert - Đăng nhập</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f7f6;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }
            .form-container {
                background: white;
                padding: 30px;
                border-radius: 8px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.1);
                width: 350px;
            }
            h2 {
                text-align: center;
                color: #2c3e50;
                margin-bottom: 20px;
            }
            .form-group {
                margin-bottom: 15px;
            }
            label {
                display: block;
                margin-bottom: 5px;
                color: #7f8c8d;
                font-size: 14px;
            }
            input {
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
                box-sizing: border-box;
            }
            button {
                width: 100%;
                padding: 10px;
                background-color: #3498db;
                border: none;
                color: white;
                font-size: 16px;
                border-radius: 4px;
                cursor: pointer;
                margin-top: 10px;
            }
            button:hover {
                background-color: #2980b9;
            }
            .message {
                margin-top: 15px;
                text-align: center;
                font-size: 14px;
                padding: 10px;
                border-radius: 4px;
                display: none;
            }
            .success {
                background-color: #d4edda;
                color: #155724;
            }
            .error {
                background-color: #f8d7da;
                color: #721c24;
            }
            .switch-link {
                text-align: center;
                margin-top: 15px;
                font-size: 13px;
            }
            .switch-link a {
                color: #2ecc71;
                text-decoration: none;
            }
        </style>
    </head>
    <body>

        <div class="form-container">
            <h2>Đăng Nhập</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="Nhập email">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="password" required placeholder="Nhập mật khẩu">
                </div>
                <button type="submit">Đăng nhập</button>
            </form>
            <div id="messageBox" class="message"></div>
            <div class="switch-link">
                Chưa có tài khoản? <a href="/register">Đăng ký ngay</a>
            </div>
            <div class="switch-link" style="margin-top: 10px;">
                <a href="/forgot-password" style="color: #e74c3c;">Quên mật khẩu?</a>
            </div>
        </div>

        <script>
            document.getElementById('loginForm').addEventListener('submit', function (e) {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const messageBox = document.getElementById('messageBox');

                fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email: email, password: password})
                })
                        .then(async response => {
                            messageBox.style.display = 'block';
                            if (response.ok) {
                                const data = await response.json();
                                messageBox.className = 'message success';
                                messageBox.innerText = 'Đăng nhập thành công! Đang chuyển hướng...';

                                // Lưu JWT token vào localStorage và Cookie
                                localStorage.setItem('token', data.token);
                                localStorage.setItem('email', data.email);
                                localStorage.setItem('role', data.role);
                                if (data.doctorId)
                                    localStorage.setItem('doctorId', data.doctorId);
                                document.cookie = `jwt=${data.token}; path=/; max-age=86400; SameSite=Strict`;

                                // Redirect theo role sau 1 giây
                                setTimeout(() => {
                                    if (data.role === 'ADMIN') {
                                        window.location.href = '/admin/dashboard';
                                    } else if (data.role === 'PATIENT') {
                                        window.location.href = '/patient/homepage';
                                    } else if (data.role === 'DOCTOR') {
                                        window.location.href = '/doctor/homepage';
                                    } else {
                                        window.location.href = '/login';
                                    }
                                }, 1000);
                            } else {
                                const text = await response.text();
                                messageBox.className = 'message error';
                                messageBox.innerText = text || 'Đăng nhập thất bại.';
                            }
                        })
                        .catch(err => {
                            messageBox.style.display = 'block';
                            messageBox.className = 'message error';
                            messageBox.innerText = 'Không thể kết nối đến server.';
                        });
            });
        </script>
    </body>
</html>

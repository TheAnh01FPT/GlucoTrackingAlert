<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GlucoTrackAlert - Quên mật khẩu</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            width: 380px;
            transition: all 0.3s ease-in-out;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 24px;
            font-weight: 600;
        }
        p.desc {
            color: #7f8c8d;
            font-size: 14px;
            text-align: center;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-size: 14px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #dcdde1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #3498db;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:active {
            transform: scale(0.98);
        }
        .message {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            line-height: 1.4;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .switch-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
        }
        .switch-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
        }
        .switch-link a:hover {
            text-decoration: underline;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="form-container" id="container">
    <!-- Bước 1: Yêu cầu OTP -->
    <div id="step1">
        <h2>Quên Mật Khẩu?</h2>
        <p class="desc">Vui lòng cung cấp địa chỉ email đã đăng ký. Chúng tôi sẽ gửi mã OTP để đặt lại mật khẩu của bạn.</p>
        <form id="requestOtpForm">
            <div class="form-group">
                <label for="reqEmail">Địa chỉ Email</label>
                <input type="email" id="reqEmail" required placeholder="example@email.com">
            </div>
            <button type="submit" id="btnSend">Gửi mã OTP</button>
        </form>
    </div>

    <!-- Bước 2: Nhập OTP và Mật khẩu mới -->
    <div id="step2" class="hidden">
        <h2>Đặt Lại Mật Khẩu</h2>
        <p class="desc">Mã OTP đã được gửi đến email của bạn. Nhập mã OTP và mật khẩu mới bên dưới để hoàn tất.</p>
        <form id="resetPasswordForm">
            <div class="form-group">
                <label for="otp">Mã OTP (6 số)</label>
                <input type="text" id="otp" required maxlength="6" pattern="[0-9]{6}" placeholder="Nhập 6 chữ số">
            </div>
            <div class="form-group">
                <label for="newPassword">Mật khẩu mới</label>
                <input type="password" id="newPassword" required placeholder="Tối thiểu 6 ký tự">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword" required placeholder="Nhập lại mật khẩu mới">
            </div>
            <button type="submit" id="btnReset">Đặt lại mật khẩu</button>
        </form>
    </div>

    <div id="messageBox" class="message"></div>

    <div class="switch-link">
        <a href="/login">&larr; Quay lại trang Đăng nhập</a>
    </div>
</div>

<script>
    let savedEmail = '';

    // Gửi yêu cầu OTP
    document.getElementById('requestOtpForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('reqEmail').value.trim();
        const btnSend = document.getElementById('btnSend');
        const messageBox = document.getElementById('messageBox');

        messageBox.style.display = 'none';
        btnSend.disabled = true;
        btnSend.innerText = 'Đang gửi...';

        fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        })
        .then(async response => {
            btnSend.disabled = false;
            btnSend.innerText = 'Gửi mã OTP';
            messageBox.style.display = 'block';

            if (response.ok) {
                savedEmail = email;
                messageBox.className = 'message success';
                messageBox.innerText = 'Mã OTP đã được gửi tới email của bạn. Vui lòng kiểm tra hộp thư.';
                
                // Chuyển sang bước 2 sau 1.5 giây
                setTimeout(() => {
                    document.getElementById('step1').classList.add('hidden');
                    document.getElementById('step2').classList.remove('hidden');
                    messageBox.style.display = 'none';
                }, 1500);
            } else {
                const text = await response.text();
                messageBox.className = 'message error';
                messageBox.innerText = text || 'Gửi OTP thất bại. Vui lòng thử lại.';
            }
        })
        .catch(err => {
            btnSend.disabled = false;
            btnSend.innerText = 'Gửi mã OTP';
            messageBox.style.display = 'block';
            messageBox.className = 'message error';
            messageBox.innerText = 'Không thể kết nối đến máy chủ.';
        });
    });

    // Reset mật khẩu với OTP
    document.getElementById('resetPasswordForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const otp = document.getElementById('otp').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const btnReset = document.getElementById('btnReset');
        const messageBox = document.getElementById('messageBox');

        if (newPassword !== confirmPassword) {
            messageBox.style.display = 'block';
            messageBox.className = 'message error';
            messageBox.innerText = 'Mật khẩu xác nhận không khớp.';
            return;
        }

        if (newPassword.length < 6) {
            messageBox.style.display = 'block';
            messageBox.className = 'message error';
            messageBox.innerText = 'Mật khẩu phải chứa ít nhất 6 ký tự.';
            return;
        }

        messageBox.style.display = 'none';
        btnReset.disabled = true;
        btnReset.innerText = 'Đang xử lý...';

        fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: savedEmail,
                otp: otp,
                newPassword: newPassword
            })
        })
        .then(async response => {
            btnReset.disabled = false;
            btnReset.innerText = 'Đặt lại mật khẩu';
            messageBox.style.display = 'block';

            if (response.ok) {
                messageBox.className = 'message success';
                messageBox.innerText = 'Đặt lại mật khẩu thành công! Đang tự động chuyển về trang Đăng nhập...';
                
                // Redirect về trang login sau 2 giây
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            } else {
                const text = await response.text();
                messageBox.className = 'message error';
                messageBox.innerText = text || 'Mã OTP không đúng hoặc đã hết hạn.';
            }
        })
        .catch(err => {
            btnReset.disabled = false;
            btnReset.innerText = 'Đặt lại mật khẩu';
            messageBox.style.display = 'block';
            messageBox.className = 'message error';
            messageBox.innerText = 'Không thể kết nối đến máy chủ.';
        });
    });
</script>

</body>
</html>

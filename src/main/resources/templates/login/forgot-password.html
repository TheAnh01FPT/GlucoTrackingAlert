<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GlucoTrackAlert - Quên mật khẩu</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #a7ffeb);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2c3e50;
        }
        .page-container {
            display: flex;
            width: 90vw;
            max-width: 1400px;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden;
            min-height: 700px;
        }
        .illustration-side {
            flex: 1;
            background: linear-gradient(135deg, #1a6b5a 0%, #27ae60 100%);
            color: white;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .illustration-side i { font-size: 80px; margin-bottom: 20px; text-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .illustration-side h2 { font-size: 28px; font-weight: 700; margin-bottom: 15px; }
        .illustration-side p { font-size: 15px; line-height: 1.6; opacity: 0.9; }
        .form-side {
            flex: 1;
            padding: 50px 40px;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .form-side h2 { font-size: 24px; font-weight: 700; color: #1a6b5a; margin-bottom: 10px; text-align: center; }
        .form-side p.desc { text-align: center; color: #7f8c8d; margin-bottom: 24px; font-size: 14px; line-height: 1.5; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #34495e; font-size: 14px; font-weight: 500; }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #dcdde1;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        .form-group input:focus { outline: none; border-color: #3498db; }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover { background-color: #2980b9; }
        button:active { transform: scale(0.98); }
        .message { margin-top: 20px; text-align: center; font-size: 14px; padding: 12px; border-radius: 6px; display: none; line-height: 1.4; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .switch-link { text-align: center; margin-top: 24px; font-size: 14px; }
        .switch-link a { color: #3498db; text-decoration: none; font-weight: 500; }
        .switch-link a:hover { text-decoration: underline; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="page-container">
    <div class="illustration-side">
        <i class="bi bi-key"></i>
        <h2>Quên mật khẩu?</h2>
        <p>Khôi phục tài khoản của bạn nhanh chóng và an toàn.</p>
    </div>
    <div class="form-side">
        <div id="step1">
            <h2>Quên Mật Khẩu?</h2>
            <p class="desc">Vui lòng nhập email đã đăng ký để nhận mã OTP.</p>
            <form id="requestOtpForm">
                <div class="form-group">
                    <label for="reqEmail">Địa chỉ Email</label>
                    <input type="email" id="reqEmail" required placeholder="example@email.com" />
                </div>
                <button type="submit" id="btnSend">Gửi mã OTP</button>
            </form>
        </div>
        <div id="step2" class="hidden">
            <h2>Đặt Lại Mật Khẩu</h2>
            <p class="desc">Nhập mã OTP và mật khẩu mới.</p>
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="otp">Mã OTP (6 số)</label>
                    <input type="text" id="otp" required maxlength="6" pattern="[0-9]{6}" placeholder="Nhập 6 chữ số" />
                </div>
                <div class="form-group">
                    <label for="newPassword">Mật khẩu mới</label>
                    <input type="password" id="newPassword" required placeholder="Tối thiểu 6 ký tự" />
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Xác nhận mật khẩu</label>
                    <input type="password" id="confirmPassword" required placeholder="Nhập lại mật khẩu mới" />
                </div>
                <button type="submit" id="btnReset">Đặt lại mật khẩu</button>
            </form>
        </div>
        <div id="messageBox" class="message"></div>
        <div class="switch-link">
            <a href="/login">← Quay lại trang Đăng nhập</a>
        </div>
    </div>
    <script>
        let savedEmail = '';
        document.getElementById('requestOtpForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('reqEmail').value.trim();
            const btnSend = document.getElementById('btnSend');
            const messageBox = document.getElementById('messageBox');
            messageBox.style.display = 'none';
            btnSend.disabled = true;
            btnSend.innerText = 'Đang gửi...';
            fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            })
                .then(async response => {
                    btnSend.disabled = false;
                    btnSend.innerText = 'Gửi mã OTP';
                    messageBox.style.display = 'block';
                    if (response.ok) {
                        savedEmail = email;
                        messageBox.className = 'message success';
                        messageBox.innerText = 'Mã OTP đã được gửi tới email của bạn. Vui lòng kiểm tra hộp thư.';
                        setTimeout(() => {
                            document.getElementById('step1').classList.add('hidden');
                            document.getElementById('step2').classList.remove('hidden');
                            messageBox.style.display = 'none';
                        }, 1500);
                    } else {
                        try {
                            const errData = await response.json();
                            messageBox.className = 'message error';
                            messageBox.innerText = errData.message || 'Gửi OTP thất bại. Vui lòng thử lại.';
                        } catch (err) {
                            const text = await response.text();
                            messageBox.className = 'message error';
                            messageBox.innerText = text || 'Gửi OTP thất bại. Vui lòng thử lại.';
                        }
                    }
                })
                .catch(() => {
                    btnSend.disabled = false;
                    btnSend.innerText = 'Gửi mã OTP';
                    messageBox.style.display = 'block';
                    messageBox.className = 'message error';
                    messageBox.innerText = 'Không thể kết nối đến máy chủ.';
                });
        });
        document.getElementById('resetPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const otp = document.getElementById('otp').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btnReset = document.getElementById('btnReset');
            const messageBox = document.getElementById('messageBox');
            if (newPassword !== confirmPassword) {
                messageBox.style.display = 'block';
                messageBox.className = 'message error';
                messageBox.innerText = 'Mật khẩu xác nhận không khớp.';
                return;
            }
            const passPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{6,32}$/;
            if (!passPattern.test(newPassword)) {
                messageBox.style.display = 'block';
                messageBox.className = 'message error';
                messageBox.innerText = 'Mật khẩu từ 6-32 ký tự, chứa ít nhất 1 chữ hoa, 1 chữ thường và 1 chữ số.';
                return;
            }
            messageBox.style.display = 'none';
            btnReset.disabled = true;
            btnReset.innerText = 'Đang xử lý...';
            fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: savedEmail, otp: otp, newPassword: newPassword })
            })
                .then(async response => {
                    btnReset.disabled = false;
                    btnReset.innerText = 'Đặt lại mật khẩu';
                    messageBox.style.display = 'block';
                    if (response.ok) {
                        messageBox.className = 'message success';
                        messageBox.innerText = 'Đặt lại mật khẩu thành công! Đang tự động chuyển về trang Đăng nhập...';
                        setTimeout(() => { window.location.href = '/login'; }, 2000);
                    } else {
                        try {
                            const errData = await response.json();
                            messageBox.className = 'message error';
                            messageBox.innerText = errData.message || 'Mã OTP không đúng hoặc đã hết hạn.';
                        } catch (err) {
                            const text = await response.text();
                            messageBox.className = 'message error';
                            messageBox.innerText = text || 'Mã OTP không đúng hoặc đã hết hạn.';
                        }
                    }
                })
                .catch(() => {
                    btnReset.disabled = false;
                    btnReset.innerText = 'Đặt lại mật khẩu';
                    messageBox.style.display = 'block';
                    messageBox.className = 'message error';
                    messageBox.innerText = 'Không thể kết nối đến máy chủ.';
                });
        });
    </script>
</body>
</html>

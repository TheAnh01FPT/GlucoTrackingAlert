spring.application.name=GlucoTrackingAlert
# Datasource - C\u1ea5u h\u00ecnh MySQL chu\u1ea9n
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/healthcare_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Mail (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:anhhthe171270@fpt.edu.vn}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
# Server
server.port=8081
app.frontend-url=http://localhost:8081
# Thymeleaf Cache (disable for development hot-reloading)
spring.thymeleaf.cache=false
server.error.include-stacktrace=always
server.error.include-message=always
# Google Calendar OAuth2
google.calendar.client-id=${GOOGLE_CLIENT_ID:914565033422-tqmmkaffv3cs7shak09orj4r8pk5b01l.apps.googleusercontent.com}
google.calendar.client-secret=${GOOGLE_CLIENT_SECRET:}

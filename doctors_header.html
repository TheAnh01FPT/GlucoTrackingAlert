        <style>
            :root {
                --primary: #1a6b5a;
                --primary-light: #e8f5f1;
                --primary-dark: #134d40;
                --accent: #27ae60;
                --danger: #e74c3c;
                --warning: #f39c12;
                --sidebar-w: 240px;
                --font: 'Be Vietnam Pro', sans-serif;
            }
            * {
                font-family: var(--font);
            }
            body {
                background: #f4f7f6;
            }

            /* Sidebar */
            .sidebar {
                width: var(--sidebar-w);
                min-height: 100vh;
                background: var(--primary-dark);
                position: fixed;
                top: 0;
                left: 0;
                display: flex;
                flex-direction: column;
                z-index: 100;
            }
            .sidebar-logo {
                padding: 24px 20px 16px;
                border-bottom: 1px solid rgba(255,255,255,.1);
            }
            .sidebar-logo span {
                color: #fff;
                font-weight: 700;
                font-size: 1.1rem;
                letter-spacing: -.3px;
            }
            .sidebar-logo small {
                color: rgba(255,255,255,.5);
                font-size: .7rem;
                display: block;
            }
            .sidebar-nav {
                padding: 12px 0;
                flex: 1;
            }
            .nav-item-link {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 10px 20px;
                color: rgba(255,255,255,.7);
                text-decoration: none;
                font-size: .875rem;
                transition: all .2s;
            }
            .nav-item-link:hover, .nav-item-link.active {
                color: #fff;
                background: rgba(255,255,255,.1);
                border-left: 3px solid var(--accent);
                padding-left: 17px;
            }
            .nav-item-link i {
                font-size: 1rem;
                width: 20px;
            }

            /* Main */
            .main {
                margin-left: var(--sidebar-w);
                padding: 28px 32px;
            }

            /* Topbar */
            .topbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 24px;
            }
            .topbar h4 {
                font-weight: 700;
                color: #1a1a2e;
                margin: 0;
            }
            .topbar-sub {
                color: #6c757d;
                font-size: .85rem;
            }

            /* Stats */
            .stat-card {
                background: #fff;
                border-radius: 12px;
                padding: 20px 24px;
                display: flex;
                align-items: center;
                gap: 16px;
                box-shadow: 0 1px 4px rgba(0,0,0,.06);
                border: 1px solid #eef1ee;
            }
            .stat-icon {
                width: 48px;
                height: 48px;
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.3rem;
            }
            .stat-label {
                font-size: .78rem;
                color: #6c757d;
                font-weight: 500;
            }
            .stat-val {
                font-size: 1.6rem;
                font-weight: 700;
                color: #1a1a2e;
                line-height: 1;
            }

            /* Search & Toolbar */
            .toolbar {
                background: #fff;
                border-radius: 12px;
                padding: 16px 20px;
                display: flex;
                gap: 12px;
                align-items: center;
                margin-bottom: 16px;
                box-shadow: 0 1px 4px rgba(0,0,0,.06);
                border: 1px solid #eef1ee;
            }
            .search-wrap {
                position: relative;
                flex: 1;
            }
            .search-wrap i {
                position: absolute;
                left: 12px;
                top: 50%;
                transform: translateY(-50%);
                color: #aaa;
            }
            .search-wrap input {
                padding-left: 36px;
                border-radius: 8px;
                border: 1px solid #dde;
                font-size: .875rem;
                height: 38px;
                width: 100%;
            }
            .search-wrap input:focus {
                outline: none;
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(26,107,90,.12);
            }

            /* Table */
            .table-wrap {
                background: #fff;
                border-radius: 12px;
                overflow: hidden;
                box-shadow: 0 1px 4px rgba(0,0,0,.06);
                border: 1px solid #eef1ee;
            }
            .table {
                margin: 0;
                font-size: .875rem;
            }
            .table thead th {
                background: #f8faf9;
                font-weight: 600;
                color: #495057;
                font-size: .78rem;
                text-transform: uppercase;
                letter-spacing: .5px;
                padding: 13px 16px;
                border-bottom: 1px solid #e9ecef;
            }
            .table tbody td {
                padding: 13px 16px;
                vertical-align: middle;
                border-color: #f0f0f0;
            }
            .table tbody tr:hover {
                background: #fafcfb;
            }
            .badge-status {
                padding: 4px 10px;
                border-radius: 20px;
                font-size: .75rem;
                font-weight: 600;
            }
            .badge-active {
                background: #d4edda;
                color: #155724;
            }
            .badge-inactive {
                background: #f8d7da;
                color: #721c24;
            }
            .badge-pending {
                background: #fff3cd;
                color: #856404;
            }
            .badge-rejected {
                background: #e2e3e5;
                color: #383d41;
            }
            .action-btn.approve {
                color: #27ae60;
            }
            .action-btn.approve:hover {
                background: #d4edda;
            }
            .action-btn.reject {
                color: #e74c3c;
            }
            .action-btn.reject:hover {
                background: #fde8e8;
            }
            .img-preview {
                width: 100%;
                max-height: 280px;
                object-fit: contain;
                border-radius: 8px;
                border: 1px solid #dee2e6;
                background: #f8f9fa;
                padding: 4px;
            }

            /* Modal */
            .modal-header {
                border-bottom: 1px solid #e9ecef;
            }
            .modal-title {
                font-weight: 700;
                color: #1a1a2e;
            }
            .form-label {
                font-size: .825rem;
                font-weight: 600;
                color: #495057;
                margin-bottom: 4px;
            }
            .form-control, .form-select {
                border-radius: 8px;
                border-color: #dde;
                font-size: .875rem;
            }
            .form-control:focus, .form-select:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(26,107,90,.12);
            }
            .btn-primary-custom {
                background: var(--primary);
                border: none;
                color: #fff;
                border-radius: 8px;
                font-weight: 600;
                padding: 8px 20px;
            }
            .btn-primary-custom:hover {
                background: var(--primary-dark);
                color: #fff;
            }
            .btn-add {
                background: var(--primary);
                border: none;
                color: #fff;
                border-radius: 8px;
                font-weight: 600;
                font-size: .875rem;
                padding: 8px 16px;
                display: flex;
                align-items: center;
                gap: 6px;
                transition: background .2s;
            }
            .btn-add:hover {
                background: var(--primary-dark);
                color: #fff;
            }
            .action-btn {
                border: none;
                background: none;
                padding: 5px 8px;
                border-radius: 6px;
                font-size: .9rem;
                cursor: pointer;
                transition: background .15s;
            }
            .action-btn.edit {
                color: var(--primary);
            }
            .action-btn.edit:hover {
                background: var(--primary-light);
            }
            .action-btn.delete {
                color: var(--danger);
            }
            .action-btn.delete:hover {
                background: #fde8e8;
            }
            .avatar-circle {
                width: 34px;
                height: 34px;
                border-radius: 50%;
                background: var(--primary-light);
                color: var(--primary);
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-weight: 700;
                font-size: .8rem;
                margin-right: 8px;
            }
            .toast-container {
                position: fixed;
                top: 20px;
                right: 20px;
                z-index: 9999;
            }
